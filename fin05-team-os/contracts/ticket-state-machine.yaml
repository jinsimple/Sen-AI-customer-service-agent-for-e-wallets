# contracts/ticket-state-machine.yaml
# NGUỒN SỰ THẬT về vòng đời ticket. Sửa = ADR + Bách duyệt.
# Đây là file mà tech-lead hay muốn "thêm một trạng thái cho tiện" nhất — đừng.

version: "1.0.0"
source: "PRD 2.1 §3 · ADR-003"

states:
  draft:
    mo_ta: "AI đã soạn nội dung khiếu nại, chưa có người tiếp nhận"
    ai_co_the_tao: true
  cskh_received:
    mo_ta: "CSKH đã tiếp nhận. CỔNG BẮT BUỘC — mọi ticket phải qua đây."
    ai_co_the_tao: false
  investigating:
    mo_ta: "Đang điều tra, AI gọi tool tra cứu"
    ai_co_the_tao: false
  awaiting_customer:
    mo_ta: "Chờ khách hàng bổ sung thông tin"
    ai_co_the_tao: false
  pending_bank:
    mo_ta: "Đã gửi tra soát, chờ ngân hàng đối tác trả lời"
    ai_co_the_tao: false
  pending_supervisor:
    mo_ta: "Đã có đề xuất, chờ sếp duyệt"
    ai_co_the_tao: false
  approved:
    mo_ta: "Sếp đã duyệt, chờ thực thi"
    ai_co_the_tao: false
    yeu_cau_role: supervisor
  rejected:
    mo_ta: "Sếp từ chối"
    ai_co_the_tao: false
    yeu_cau_role: supervisor
  executed:
    mo_ta: "Đã thực thi xong hành động tài chính"
    ai_co_the_tao: false
    cham_tien: true
  closed:
    mo_ta: "Đóng"
    ai_co_the_tao: false

transitions:
  - from: draft
    to: cskh_received
    boi: [cskh, supervisor]
    ghi_chu: "AI KHÔNG được thực hiện transition này — RÀNG BUỘC CỨNG 2"

  - from: cskh_received
    to: investigating
    boi: [cskh, ai_agent]

  - from: investigating
    to: awaiting_customer
    boi: [cskh, ai_agent]

  - from: awaiting_customer
    to: investigating
    boi: [cskh, ai_agent]

  - from: investigating
    to: pending_bank
    boi: [supervisor]
    dieu_kien: "scope in [tu_ngan_hang, ra_ngan_hang]"

  - from: investigating
    to: pending_supervisor
    boi: [cskh, ai_agent]
    ghi_chu: "Áp dụng cho MỌI scope, kể cả noi_bo_vi — ADR-002"

  - from: pending_bank
    to: pending_supervisor
    boi: [cskh]

  - from: pending_supervisor
    to: approved
    boi: [supervisor]
    ghi_chu: "Transition duy nhất mở đường tới executed"

  - from: pending_supervisor
    to: rejected
    boi: [supervisor]

  - from: approved
    to: executed
    boi: [supervisor]
    cham_tien: true

  - from: [rejected, executed]
    to: closed
    boi: [cskh, supervisor]

# ---------------------------------------------------------------------------
invariants:
  - id: INV-05
    mo_ta: >
      Không tồn tại đường đi từ draft tới executed mà không đi qua cskh_received
      VÀ pending_supervisor VÀ approved.
    nguon: "CLAUDE.md §2.1 + §2.2"
  - id: INV-06
    mo_ta: "ai_agent không xuất hiện trong 'boi' của bất kỳ transition nào có cham_tien=true"
    nguon: "CLAUDE.md §2.1"
  - id: INV-07
    mo_ta: "Không transition nào từ trạng thái gắn cờ gian lận dẫn thẳng tới khoá ví"
    nguon: "CLAUDE.md §2.5"

open_questions:
  - "Có nên mô phỏng ngân hàng đối tác trả lời SAI hoặc MÂU THUẪN không?
     Nếu có, cần thêm state hoặc field ghi nhận mâu thuẫn. (PRD §8.7)"
  - "Ngưỡng N lần hỏi lại khách hàng trước khi kết luận 'không tìm thấy giao dịch'
     — đề xuất hiện tại N=2, chưa được chuyên gia xác nhận. (PRD §8.6)"
