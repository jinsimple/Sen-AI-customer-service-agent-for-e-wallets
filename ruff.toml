# Khớp Dockerfile (FROM python:3.12-slim, cả 2 stage) — "py311" cũ hơn bản
# thật đang chạy production, làm ruff báo SAI cú pháp f-string hợp lệ trên
# 3.12 (backslash trong biểu thức f-string, PEP 701) là "invalid-syntax" cho
# một phiên bản không ai dùng. Phát hiện lúc rà CI đỏ 20/08 — không phải lỗi
# trong code, là cấu hình ruff lệch với runtime thật.
target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[lint.per-file-ignores]
# N802 (tên hàm phải chữ thường) là luật đặt tên cho code TIẾNG ANH — tên test
# của dự án này là CÂU TIẾNG VIỆT, chữ HOA giữa tên là dấu nhấn ngữ nghĩa có
# chủ đích (CHUAN-VIET-TEST.md:693), vd `test_thieu_llm_api_key_KHONG_roi_ve_
# openai_api_key_thay_the` — chữ HOA giúp mắt lướt qua danh sách test đỏ nhận
# ra ngay đâu là điều kiện đang bị kiểm. Đổi tên 26+ hàm để chiều một luật
# viết cho ngôn ngữ khác là đánh đổi thứ ĐỌC ĐƯỢC lấy thứ HỢP LỆ. CHỈ miễn
# N802, CHỈ trong tests/ — mọi luật `N` khác (vd N806 biến cục bộ) và mọi tên
# hàm trong src/ vẫn phải theo luật, không có lý do tiếng Việt nào ở đó.
"tests/**" = ["N802"]
# 04/09 — cùng lý do trên, cùng khuôn: eval/bo-cham/bom_loi_khach.py có hàm
# `_kiem_tra_CA_CU_MO_HO` (viết hoa nhấn "case cũ mơ hồ"), không phải lỗi
# đặt tên, là chủ đích. eval/bo-cham/ sinh test data, cùng bản chất với
# tests/, không phải src/.
"eval/bo-cham/**" = ["N802"]
# 04/09 — cases.py tự khai ở đầu file: "Nguồn: goi_30_nhan_NGUOI.md — giữ
# NGUYÊN VĂN, không sửa một chữ nào." 5 dòng W291 nằm TRONG chuỗi
# agent="""...""" nhiều dòng — trailing whitespace đó là PHẦN CỦA DỮ LIỆU
# trích dẫn, không phải style code. `ruff --fix`/`--unsafe-fixes` sẽ XOÁ nó,
# tức sửa đúng "một chữ" (khoảng trắng) mà comment đầu file cấm sửa. Miễn
# W291 CHỈ file này, không lan sang cases khác hay eval/bo-cham/** nói chung.
"eval/bo-cham/cases.py" = ["W291"]

[format]
quote-style = "double"
indent-style = "space"
