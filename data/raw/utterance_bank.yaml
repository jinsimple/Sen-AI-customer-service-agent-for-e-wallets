# FIN-05 — Ngân hàng mẫu diễn đạt của khách hàng (Data Brief §2.2)
#
# NGUỒN & RANH GIỚI ĐẠO ĐỨC:
# - 100% mẫu câu do team TỰ VIẾT theo phong cách diễn đạt phổ biến
#   (teencode, không dấu, sai chính tả, mơ hồ, cảm xúc, mô tả sai loại).
# - KHÔNG sao chép nguyên văn từ review/forum/fanpage nào; KHÔNG chứa
#   SĐT/mã GD/tên người thật. Việc đối chiếu văn phong với corpus công khai
#   là bước sau và không thay đổi nguyên tắc "không lưu nguyên văn".
# - Mọi con số trong câu là PLACEHOLDER — generator inject từ lớp sổ cái
#   (Data Brief §2.5: LLM/ngôn ngữ không được sinh sự thật).
#
# styles: full=đủ dấu chuẩn, nd=không dấu, tc=teencode, typo=sai chính tả,
#         vague=mơ hồ, emo=cảm xúc, mislabel=khách tự chẩn đoán sai loại
