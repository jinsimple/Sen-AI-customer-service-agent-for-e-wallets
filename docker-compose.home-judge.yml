# Override CHỈ cho build frontend deploy VPS Windows PO thật (`--profile home`,
# domain judge xem — app.adaptivealgo.uk). Đưa vào repo 05/09.
#
# VÌ SAO FILE RIÊNG, không sửa `build.args` thẳng ở docker-compose.yml gốc:
# 5 override khác trong repo (qa-stripe/ctc1-check/dot-otp/ttl-test/do) KHÔNG
# tự khai `build.args` cho frontend — nếu đổi default ở file gốc, cả 5 ngăn
# đó ÂM THẦM thừa hưởng NEXT_PUBLIC_QUICK_LOGIN=true/HIDE_ENV_BADGE=true theo
# (docker compose merge map `args` giữa các file, thiếu khai = kế thừa từ
# gốc) — mở nút đăng nhập nhanh + ẩn badge môi trường ở NHỮNG NGĂN không ai
# yêu cầu, đúng khuôn rủi ro "đổi 1 vật chung, lệch N nơi" dự án đã trả giá
# nhiều lần. File riêng CHỈ áp dụng khi PO CHỦ ĐỘNG thêm `-f` này vào lệnh
# deploy — không đổi hành vi bất kỳ ngăn nào khác.
#
# CHỈ ghim 2 build-arg — KHÔNG bao gồm APP_ENV/OTP_DEMO_MODE/ENABLE_API_DOCS
# (đó là biến MÔI TRƯỜNG lúc CHẠY container, PO tự quản trên `.env` VPS của
# họ, không phải build-arg đóng cứng vào ảnh — xem src/config.py cho giá trị
# khuyến nghị "judge-prod": APP_ENV=demo, OTP_DEMO_MODE=true,
# ENABLE_API_DOCS để trống/off).
#
# Dựng: docker compose -f docker-compose.yml -f docker-compose.home-judge.yml --profile home up -d --build
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_QUICK_LOGIN: "true"
        NEXT_PUBLIC_HIDE_ENV_BADGE: "true"
