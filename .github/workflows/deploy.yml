name: Deploy

# Push lên main -> SSH vào VPS -> git pull + rebuild container. Không cần
# container registry (build thẳng trên VPS) — đơn giản nhất cho quy mô pilot.
# Cần 3 secret trong GitHub repo Settings > Secrets and variables > Actions:
#   DEPLOY_HOST      IP public của VPS Oracle Cloud
#   DEPLOY_USER      user SSH trên VPS (thường "ubuntu")
#   DEPLOY_SSH_KEY   private key của deploy key riêng (xem docs/DEPLOY.md)
# Xem docs/DEPLOY.md để biết cách tạo 3 secret này.

# CỔNG CHẶN (PO duyệt PO-3): deploy KHÔNG còn chạy theo `push` nữa. Nó chờ
# workflow "CI" kết thúc rồi mới xét. `push` cũ nghĩa là deploy chạy SONG SONG
# với CI — code làm đỏ toàn bộ test vẫn lên production, chỉ cần push trúng main.
# Hiện chưa gây hại vì thiếu secret DEPLOY_HOST, nhưng nó là quả mìn hẹn giờ:
# nổ đúng vào lúc PO đặt secret để deploy lần đầu.
#
# `workflow_run` là cách duy nhất bắc cầu điều kiện giữa HAI workflow file khác
# nhau (`needs:` chỉ dùng được cho job cùng file). Bù lại nó có 2 cái bẫy, đã
# xử ở `if` bên dưới: nó bắn cho MỌI nhánh (kể cả nhánh dev), và bắn cho cả lượt
# CI THẤT BẠI — thiếu một trong hai vế là cổng chặn thành hình thức.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: # cho phép bấm chạy tay từ tab Actions khi cần deploy lại không đổi code

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch: bấm tay thì luôn cho chạy (người bấm tự chịu trách
    # nhiệm). workflow_run: bắt buộc CI XANH và đúng nhánh main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: SSH và deploy lại trên VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/fin05
            git pull origin main
            docker compose up -d --build
            docker image prune -f

      # ⚠️ NẾU THÊM SMOKE TEST SAU DEPLOY — ĐỌC HẾT KHỐI NÀY TRƯỚC KHI GÕ.
      #
      # 🔴 Bẫy này cắn NGƯỜI CÀNG TUÂN THỦ CHECKLIST CÀNG DỄ DÍNH: checklist
      # đóng gói production chuẩn dặn "thêm smoke test sau deploy
      # (`curl -f .../health`)". Làm ĐÚNG lời dặn đó ở đây là tự tay thêm một
      # CỔNG GIẢ vào CI/CD — và nó sẽ KHÔNG BAO GIỜ KÊU.
      #
      # KHÔNG gọi https://app.adaptivealgo.uk/health
      #   [ĐO 27/08, gọi thật từ ngoài] Caddy KHÔNG có route riêng cho /health
      #   phía backend ⟹ yêu cầu rơi vào catch-all ⟹ được frontend phục vụ
      #   bằng trang /login ⟹ LUÔN 200, KỂ CẢ KHI BACKEND ĐÃ CHẾT HẲN.
      #   Một cổng trả 200 trong mọi trạng thái không kiểm được trạng thái nào.
      #
      # Cổng THẬT — chạm THẲNG process backend qua mạng nội bộ Docker, không
      # qua Caddy (đã dùng đúng ở scripts/deploy_home.ps1:163):
      #   docker compose exec -T backend python -c \
      #     "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=5)"
      #
      # ⚠️ CHƯA ĐO ĐƯỢC trên runner GitHub Actions: script trên chạy trên hộp
      # Windows của PO qua `docker compose --profile home`. Runner SSH có
      # `exec` được vào container trên máy đích hay không là câu CHƯA AI TRẢ
      # LỜI — cần DevOps + PO quyết, ĐỪNG tự thêm.
      #
      # 📌 Vì sao chỉ để lại bình luận mà không thêm cổng: một smoke test SAI
      # còn tệ hơn KHÔNG CÓ smoke test. Không có thì ai cũng biết là chưa kiểm;
      # có mà giả thì cả đội tin rằng đã kiểm. Trạng thái thứ hai đắt hơn.
