name: CI

# 6 stage đúng theo FIN05-StressTest-Plan.md mục 8 (đã thích ứng — xem
# docs/TESTING.md), giữ NGUYÊN nhịp độ gốc: Stage 1-5 chạy MỌI PR/push vào
# main (bao gồm chạy TOÀN BỘ golden_set/adversarial_set, không rút gọn), Stage
# 6 (tải/chaos) tách job riêng chạy nightly vì tốn thời gian thật — không
# phải vì giảm phạm vi.

on:
  push:
    # `dev/**` — nhánh làm việc thật của dự án (dev/learning-loop...). Trước đây
    # chỉ có main+develop nên MỌI commit của đợt learning-loop đều không được CI
    # nhìn thấy: local đi trước remote ~40 commit mà không có lượt kiểm nào.
    branches: [main, develop, "dev/**"]
  pull_request:
    # BỎ giới hạn đích: PR vào nhánh nào cũng phải qua CI. Giới hạn cũ [main]
    # nghĩa là PR dev/learning-loop -> dev/khac không chạy test nào.
    branches: ["**"]
  schedule:
    - cron: "0 20 * * *" # 03:00 giờ VN — Stage 6 (load test) chạy nightly
  workflow_dispatch: {}

env:
  # JWT_SECRET_KEY/FIELD_ENCRYPTION_KEY: src/config.py raise lỗi ngay lúc
  # import nếu thiếu (cố ý, chống "trông như bảo mật nhưng không có key thật")
  # — CI chỉ chạy trên DB tạm/ephemeral mỗi lần nên sinh key MỚI mỗi run,
  # không cần lưu cố định trong GitHub Secrets. OPENAI_API_KEY thì PHẢI là
  # secret thật (Settings > Secrets and variables > Actions) mới chạy được
  # Stage 4/5 (gọi LLM thật) — thiếu secret đó 2 stage này sẽ fail rõ ràng,
  # không fail âm thầm.
  JWT_SECRET_KEY: ci-ephemeral-not-for-production-use-only-in-ci-runs
  # PHẢI là base64-urlsafe của ĐÚNG 32 byte (yêu cầu của Fernet). Giá trị cũ
  # giải mã ra 33 byte -> mọi job đọc config chết ngay ở conftest với
  # "Fernet key must be 32 url-safe base64-encoded bytes". Đây là chuỗi
  # "ci-ephemeral-key-not-for-prod-32" — cố ý đọc được để không ai nhầm là key
  # thật; sinh key mới bằng: python -c "from cryptography.fernet import Fernet;
  # print(Fernet.generate_key().decode())"
  FIELD_ENCRYPTION_KEY: "Y2ktZXBoZW1lcmFsLWtleS1ub3QtZm9yLXByb2QtMzI="
  # fake:// -> fakeredis (src/redis_client.py) — CI không cần Redis thật, đúng
  # convention playbooks/production-packaging-checklist.md.
  REDIS_URL: fake://ci
  # DATABASE_URL giờ BẮT BUỘC (ADR-013 — bỏ fallback SQLite im lặng từng làm
  # hệ thống tách đôi database). Job nào cần Postgres thật thì override lại ở
  # cấp job (xem db-migration-test).
  DATABASE_URL: "sqlite:///:memory:"

jobs:
  # ---------------------------------------------------------------------
  # Stage 0: RÀNG BUỘC CỨNG (CLAUDE.md §2) — cổng chặn cao nhất của dự án.
  #
  # Tách riêng khỏi lint-and-test có chủ đích: đây là 5 ràng buộc không được
  # phép thoả hiệp (HITL tuyệt đối, AI không vượt cấp, cấm bịa số liệu, xác
  # thực, gắn cờ ≠ khoá ví). Một job riêng có tên rõ ràng để khi đỏ, biết ngay
  # là vi phạm hiến pháp chứ không phải test thường hỏng.
  #
  # Job này cũng canh CONTRACT DRIFT: test introspect app đang chạy rồi so
  # khớp với contracts/. Thêm route, đổi guard, đổi tên tool mà quên cập nhật
  # contract → ĐỎ. Đây là cơ chế thay thế việc bắt agent này viết file tóm tắt
  # cho agent kia đọc.
  #
  # Chạy nhanh (~2s) và không cần dịch vụ ngoài → đặt đầu tiên, fail fast.
  # ---------------------------------------------------------------------
  invariants:
    name: Ràng buộc cứng + contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 5 ràng buộc cứng (CLAUDE.md §2)
        run: pytest tests/test_invariants.py -v
        env:
          OPENAI_API_KEY: test-key-not-used-by-unit-tests
          # Tắt tracing: test gọi thẳng tool.invoke() để kiểm chốt chặn OTP,
          # không được để mỗi lần chạy CI bắn trace lên LangSmith.
          LANGCHAIN_TRACING_V2: "false"
          LANGSMITH_TRACING: "false"
      - name: Phát hiện artifact lỗi thời so với contracts/
        run: python scripts/check_contracts.py --verbose

  # ---------------------------------------------------------------------
  # Stage 1: Lint + Unit test
  # ---------------------------------------------------------------------
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint với ruff
        run: ruff check src/ tests/ eval/
      - name: Chạy toàn bộ pytest (unit + integration, không gọi LLM thật)
        # -m "not security_finding": loại test finding P0 CHƯA VÁ (xem job
        # security-findings-gate bên dưới) — tách riêng để 1 job đỏ có tên rõ
        # ràng, không lẫn vào hàng trăm test bình thường của job này (xem
        # docs/TESTING.md mục "v2 bổ sung" và pytest.ini).
        run: pytest tests/ -v --tb=short -m "not security_finding"
        env:
          OPENAI_API_KEY: test-key-not-used-by-unit-tests

  # ---------------------------------------------------------------------
  # Stage 1c: Migration chain test (FIN05-StressTest-Plan-v4 M4-01/02/03) —
  # rủi ro cao nhất khi deploy domain thật lần đầu (DB production chạy
  # `alembic upgrade head` từ RỖNG). Test SQLite (dùng ở lint-and-test) KHÔNG
  # chứng minh được điều này — Postgres có ràng buộc FK/type chặt hơn nhiều.
  # Dùng GitHub Actions `services:` để có Postgres THẬT trên `localhost` —
  # KHÁC docker-compose.yml của app (service đó cố ý không publish port ra
  # host, xem tests/test_observability/test_network_isolation.py).
  # ---------------------------------------------------------------------
  db-migration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fin05_ci
          POSTGRES_PASSWORD: fin05-ci-ephemeral-password
          POSTGRES_DB: fin05_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fin05_ci -d fin05_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migration chain test trên Postgres thật
        run: pytest tests/test_migrations/ -v --tb=short
        env:
          DATABASE_URL: postgresql+psycopg2://fin05_ci:fin05-ci-ephemeral-password@localhost:5432/fin05_ci
          OPENAI_API_KEY: test-key-not-used-by-migration-tests

  # ---------------------------------------------------------------------
  # Stage 1d: Frontend lint + typecheck + unit test (FIN05-StressTest-Plan-v4
  # F4-01/F4-02) — phát hiện thật lúc thêm: trước đây CI KHÔNG có bước nào
  # chạy eslint/tsc cho frontend cả (chỉ có `npm audit` ở dependency-and-
  # secret-scan) — lỗi type/lint chỉ bị bắt khi build thật hoặc chạy tay.
  # Vitest (mới, xem vitest.config.ts) TÁCH khỏi Playwright — nhanh, không
  # cần dựng backend/docker compose, chạy được mọi PR.
  # ---------------------------------------------------------------------
  frontend-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Lint (eslint)
        run: npm run lint --prefix frontend
      # `next typegen` sinh .next/types/routes.d.ts — nơi khai báo global
      # PageProps<>/LayoutProps<> mà Next 16 dùng cho typed routes. Máy dev có
      # sẵn thư mục này do đã từng `next dev`/`next build`; runner CI thì SẠCH,
      # nên tsc báo "Cannot find name 'PageProps'" dù code không sai. Đây đúng
      # loại lỗi "máy tôi chạy được" mà job CI sinh ra để bắt.
      - name: Sinh type cho typed routes (next typegen)
        run: npx --prefix frontend next typegen frontend
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck --prefix frontend
      - name: Unit test (Vitest)
        run: npm run test:unit --prefix frontend

  # ---------------------------------------------------------------------
  # Stage 1b: Security findings gate (FIN05-StressTest-Plan-v2, P0-1/P0-3/
  # P0-4/P0-5) — CHẶN CI theo đúng chủ đích (quyết định 2026-08-11, xem
  # docs/TESTING.md): các test này FAIL cho tới khi từng finding được vá
  # thật, hoặc chính thức "chấp nhận rủi ro" (cập nhật test theo quyết định,
  # giống cách CVE chromadb đã xử lý — không xoá/skip test).
  # ---------------------------------------------------------------------
  security-findings-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test finding bảo mật P0 chưa vá (kỳ vọng ĐỎ cho tới khi vá/chấp nhận rủi ro)
        run: pytest tests/ -v --tb=short -m security_finding
        env:
          OPENAI_API_KEY: test-key-not-used-by-unit-tests

  # ---------------------------------------------------------------------
  # Stage 2: Dependency & secret scan (C5, C7)
  # ---------------------------------------------------------------------
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks cần full history để quét secret trong các commit cũ
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pip-audit
      - name: Quét CVE gói Python (C7)
        # --ignore-vuln PYSEC-2026-311 (chromadb, CVE-2026-45829,
        # GHSA-f4j7-r4q5-qw2c): code injection pre-auth qua endpoint HTTP
        # /api/v2/tenants/{tenant}/databases/{db}/collections khi
        # trust_remote_code=true — CHỈ khai thác được nếu chạy chromadb như
        # server độc lập. Dự án dùng chromadb.PersistentClient (nhúng trong
        # tiến trình, src/rag/store.py) — KHÔNG có server/port nào cho
        # chroma (xem docker-compose.yml, chỉ mount volume), grep
        # trust_remote_code toàn repo = 0 kết quả -> bề mặt tấn công không
        # tồn tại trong cách triển khai này. CHƯA có bản vá (1.5.9 là bản
        # mới nhất, vẫn trong khoảng ảnh hưởng) nên không thể nâng cấp —
        # xác nhận định kỳ bằng `pip-audit -r requirements.txt` KHÔNG kèm
        # --ignore-vuln, gỡ dòng ignore này ngay khi có bản vá.
        run: pip-audit --strict --ignore-vuln PYSEC-2026-311
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Quét CVE gói npm (C7, bổ sung — bản gốc bỏ sót JS side)
        run: npm audit --prefix frontend --audit-level=high
      - name: Quét secret lỡ commit (C5)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # Stage 3: AppSec test (Nhóm C) — ma trận phân quyền + injection
  # ---------------------------------------------------------------------
  appsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/test_api/ -v
        env:
          OPENAI_API_KEY: test-key-not-used-by-authz-tests

  # ---------------------------------------------------------------------
  # Stage 4: Business rule test (Nhóm A) — TOÀN BỘ golden_set.jsonl (120
  # case) + 3 bộ chuyển thể từ FIN05_QA_TestCases.jsonl (functional/fraud/err
  # _qa_set — cùng schema/harness, không cắt phạm vi), mỗi case gọi OpenAI
  # thật. Cần secret OPENAI_API_KEY thật.
  # ---------------------------------------------------------------------
  business-rules-golden-set:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' }} # Stage 6 (nightly) không cần chạy lại stage này
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python eval/run_golden_set.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: python eval/run_golden_set.py --file eval/functional_qa_set.jsonl
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: python eval/run_golden_set.py --file eval/fraud_qa_set.jsonl
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: python eval/run_golden_set.py --file eval/err_qa_set.jsonl
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-set-report
          path: eval/results/golden_run_*.md

  # ---------------------------------------------------------------------
  # Stage 5: AI safety adversarial suite (Nhóm B) — 45 case (40 gốc +
  # ADV-041..045 SEC-001/SEC-007/AUTH-002/AUTH-003), gọi OpenAI thật. Cộng
  # llm_judge_set (case ux_tone không kiểm được bằng code).
  # ---------------------------------------------------------------------
  ai-safety-adversarial:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python eval/run_adversarial_set.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: python eval/run_llm_judge_set.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adversarial-set-report
          path: |
            eval/results/adversarial_run_*.md
            eval/results/llm_judge_run_*.md

  # ---------------------------------------------------------------------
  # Stage 6: Load/chaos test (Nhóm D) — CHỈ chạy nightly (schedule) hoặc bấm
  # tay (workflow_dispatch), KHÔNG chạy trên PR — đúng bản gốc mục 8: tốn
  # thời gian thật (cần server sống + nhiều phút chạy), không phải giảm phạm
  # vi. D3 (soak 1-2h thật) không chạy tự động ở đây — chạy thủ công theo
  # hướng dẫn trong tests/load/locustfile.py trước milestone lớn.
  # ---------------------------------------------------------------------
  load-test-nightly:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt locust
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Khởi động backend + seed dữ liệu tối thiểu
        run: |
          python -m alembic upgrade head
          python scripts/seed_db.py
          nohup uvicorn src.api.main:app --host 0.0.0.0 --port 8010 &
          sleep 5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Build + khởi động frontend (locustfile nhắm /api/* qua BFF, đúng đường đi thật)
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          BACKEND_URL=http://localhost:8010 nohup npm run start --prefix frontend -- -p 3000 &
          sleep 8
      - name: D1+D2 rút gọn (vài phút, không phải soak 1-2h) qua BFF
        run: |
          locust -f tests/load/locustfile.py --host http://localhost:3000 \
            --headless -u 30 -r 5 --run-time 5m --csv=eval/results/load_nightly
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: eval/results/load_nightly*

  # ---------------------------------------------------------------------
  # Stage 7: Playwright e2e (Nhóm identity/AUTH-*, FIN05_QA_TestCases.jsonl)
  # — cần dựng đủ backend THẬT + frontend THẬT (không mock), giống Stage 6,
  # nên CHỈ chạy nightly/tay, không chạy trên mọi PR. OTP giờ được backend
  # xác thực thật (src/auth.py::require_otp_verified) — test này xác nhận
  # toàn bộ chuỗi browser → BFF → FastAPI, không chỉ riêng logic backend.
  # ---------------------------------------------------------------------
  e2e-playwright-nightly:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Khởi động backend + seed dữ liệu
        run: |
          python -m alembic upgrade head
          python scripts/seed_db.py
          nohup uvicorn src.api.main:app --host 0.0.0.0 --port 8010 &
          sleep 5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Build + khởi động frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          BACKEND_URL=http://localhost:8010 nohup npm run start --prefix frontend -- -p 3000 &
          sleep 8
      - name: Cài Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Chạy Playwright (nhóm AUTH-*)
        run: npx --prefix frontend playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # ---------------------------------------------------------------------
  # Stage 8: Live-chat E2E (FIN05-StressTest-Plan-v4 L4-01..L4-05) — KHÁC
  # Stage 7 (uvicorn/npm trần, không có Caddy): live-chat CẦN mạng Docker
  # thật (`docker compose up`, Caddy → backend) để /ws/live-chat route đúng
  # — bug thật (tin nhắn lặp, session mồ côi, dashboard không realtime) chỉ
  # lộ ra qua đúng topology này (xem playwright.livechat.config.ts). Nightly
  # only — build + khởi động cả 5 service tốn thời gian thật.
  # ---------------------------------------------------------------------
  livechat-e2e-nightly:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tạo .env cho docker compose (giá trị CI ephemeral, OPENAI_API_KEY thật từ secret)
        run: |
          cat > .env <<EOF
          POSTGRES_USER=fin05_ci
          POSTGRES_PASSWORD=fin05-ci-ephemeral-password
          POSTGRES_DB=fin05_ci
          JWT_SECRET_KEY=ci-ephemeral-not-for-production-use-only-in-ci-runs
          FIELD_ENCRYPTION_KEY=Y2ktZXBoZW1lcmFsLWtleS1ub3QtZm9yLXByb2QtMzI=
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          SITE_DOMAIN=localhost
          EOF
      - name: docker compose up (đủ 5 service) + chờ healthy
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            unhealthy=$(docker compose ps --format json | python3 -c "
          import json, sys
          rows = [json.loads(l) for l in sys.stdin]
          print(sum(1 for r in rows if r.get('Health') not in ('healthy', '')))
          ")
            [ "$unhealthy" = "0" ] && break
            sleep 5
          done
      - name: Seed dữ liệu demo (users.jsonl cần cho login test)
        run: docker compose exec -T backend su appuser -c "python3 scripts/seed_db.py" || true
      - run: npm ci --prefix frontend
      - name: Cài Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Chạy Playwright (live-chat E2E)
        run: npm run test:e2e:livechat --prefix frontend
      - name: Docker logs (khi fail, để debug)
        if: failure()
        run: docker compose logs backend --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livechat-playwright-report
          path: frontend/playwright-report-livechat/
