name: CI

# 6 stage đúng theo FIN05-StressTest-Plan.md mục 8 (đã thích ứng — xem
# docs/TESTING.md), giữ NGUYÊN nhịp độ gốc: Stage 1-5 chạy MỌI PR/push vào
# main (bao gồm chạy TOÀN BỘ golden_set/adversarial_set, không rút gọn), Stage
# 6 (tải/chaos) tách job riêng chạy nightly vì tốn thời gian thật — không
# phải vì giảm phạm vi.

on:
  push:
    # `dev/**` — nhánh làm việc thật của dự án (dev/learning-loop...). Trước đây
    # chỉ có main+develop nên MỌI commit của đợt learning-loop đều không được CI
    # nhìn thấy: local đi trước remote ~40 commit mà không có lượt kiểm nào.
    branches: [main, develop, "dev/**"]
  pull_request:
    # BỎ giới hạn đích: PR vào nhánh nào cũng phải qua CI. Giới hạn cũ [main]
    # nghĩa là PR dev/learning-loop -> dev/khac không chạy test nào.
    branches: ["**"]
  # 🔴 `if:` schedule/dispatch trên BỐN job nightly là LỚP PHÒNG THỦ NGÂN SÁCH
  # DUY NHẤT còn lại — đừng gỡ. Trước có ba lớp, hai lớp kia đã mất hoặc sắp:
  #   ① tính ephemeral của `ubuntu-latest` — lớp KHÔNG AI KHAI (STATE §5.R)
  #   ② billing hỏng — thứ ĐANG thật sự chặn chúng, sẽ hết ngay khi trả tiền
  #   ③ `if:` này — lớp duy nhất còn lại
  # Bốn job ấy gọi model bằng KHOÁ THẬT lúc 03:00 giờ VN, KHÔNG AI NGỒI XEM.
  # Gỡ `if:`, hoặc chuyển chúng sang runner tự quản, = một quyết định TIÊU TIỀN
  # cần PO duyệt ngân sách — KHÔNG phải việc dọn dẹp cấu hình.
  schedule:
    - cron: "0 20 * * *" # 03:00 giờ VN — Stage 6 (load test) chạy nightly
  workflow_dispatch: {}


# HAI NHÓM TÁCH HẲN — push không bao giờ giết nightly, và ngược lại.
# Cần có vì runner tự quản là FIFO DÙNG CHUNG với team khác: hai lượt của
# CHÍNH TA chạy song song sẽ tự giành cổng 80/443 (`-p` đổi TÊN PROJECT chứ
# không đổi cổng host — xem bước "Tiền kiểm CỔNG").
#
# ⚠️ CÁI GIÁ, khai ra chứ không giấu: `cancel-in-progress` cho push nghĩa là
# khi đẩy liên tiếp, COMMIT Ở GIỮA KHÔNG CÓ KẾT QUẢ CỔNG RIÊNG. Chấp nhận vì
# lượt bị huỷ đang đo một cây KHÔNG CÒN LÀ HEAD, và trên máy dùng chung nó
# còn chiếm chỗ của team khác cho một phép đo đã lỗi thời.
# Cần chứng thực TỪNG commit (vd trước mốc nộp bài) thì đổi `false` TẠM THỜI
# và khai ra — đừng đổi im lặng.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'push' }}
  # 🔴 ĐỔI true -> false 18/08, 12 phút sau khi land `true`. KHÔNG phải đổi ý
  # theo cảm tính — theo MỘT PHÉP ĐO:
  #     job invariants chạy hết      4′04″   (đo được)
  #     khoảng cách giữa hai lần đẩy ≈ 2′30″–3′  (4 lượt: 12:16·12:19·12:23·12:26)
  # Cổng chạy LÂU HƠN khoảng cách giữa hai lần đẩy ⟹ với `true` và bốn phiên
  # cùng đẩy lên một nhánh, hệ quả không phải "thỉnh thoảng mất một kết quả"
  # mà là GẦN NHƯ KHÔNG LƯỢT NÀO VỀ ĐÍCH. Đó là cổng bị vô hiệu hoá, và nó
  # tái lập đúng cái đau vừa mất hai ngày để chữa ("17/08 tới nay không commit
  # nào qua cổng") — trước là billing chặn, sau là ta tự chặn.
  # Ca đầu tiên đã chứng minh: `0939e2f` giết lượt đo `5c8fba4` sau 150 giây.
  #
  # Cái giá phía kia (lượt xếp hàng chiếm chỗ FIFO của team khác) nhẹ hơn:
  # lượt ĐANG XẾP HÀNG không giữ máy, chỉ chiếm khi thật sự chạy.
  cancel-in-progress: false
env:
  # JWT_SECRET_KEY/FIELD_ENCRYPTION_KEY: src/config.py raise lỗi ngay lúc
  # import nếu thiếu (cố ý, chống "trông như bảo mật nhưng không có key thật")
  # — CI chỉ chạy trên DB tạm/ephemeral mỗi lần nên sinh key MỚI mỗi run,
  # không cần lưu cố định trong GitHub Secrets. OPENAI_API_KEY thì PHẢI là
  # secret thật (Settings > Secrets and variables > Actions) mới chạy được
  # Stage 4/5 (gọi LLM thật) — thiếu secret đó 2 stage này sẽ fail rõ ràng,
  # không fail âm thầm.
  JWT_SECRET_KEY: ci-ephemeral-not-for-production-use-only-in-ci-runs
  # PHẢI là base64-urlsafe của ĐÚNG 32 byte (yêu cầu của Fernet). Giá trị cũ
  # giải mã ra 33 byte -> mọi job đọc config chết ngay ở conftest với
  # "Fernet key must be 32 url-safe base64-encoded bytes". Đây là chuỗi
  # "ci-ephemeral-key-not-for-prod-32" — cố ý đọc được để không ai nhầm là key
  # thật; sinh key mới bằng: python -c "from cryptography.fernet import Fernet;
  # print(Fernet.generate_key().decode())"
  FIELD_ENCRYPTION_KEY: "Y2ktZXBoZW1lcmFsLWtleS1ub3QtZm9yLXByb2QtMzI="
  # fake:// -> fakeredis (src/redis_client.py) — CI không cần Redis thật, đúng
  # convention playbooks/production-packaging-checklist.md.
  REDIS_URL: fake://ci
  # DATABASE_URL giờ BẮT BUỘC (ADR-013 — bỏ fallback SQLite im lặng từng làm
  # hệ thống tách đôi database). Job nào cần Postgres thật thì override lại ở
  # cấp job (xem db-migration-test).
  DATABASE_URL: "sqlite:///:memory:"

jobs:
  # ---------------------------------------------------------------------
  # Stage 0: RÀNG BUỘC CỨNG (CLAUDE.md §2) — cổng chặn cao nhất của dự án.
  #
  # Tách riêng khỏi lint-and-test có chủ đích: đây là 5 ràng buộc không được
  # phép thoả hiệp (HITL tuyệt đối, AI không vượt cấp, cấm bịa số liệu, xác
  # thực, gắn cờ ≠ khoá ví). Một job riêng có tên rõ ràng để khi đỏ, biết ngay
  # là vi phạm hiến pháp chứ không phải test thường hỏng.
  #
  # Job này cũng canh CONTRACT DRIFT: test introspect app đang chạy rồi so
  # khớp với contracts/. Thêm route, đổi guard, đổi tên tool mà quên cập nhật
  # contract → ĐỎ. Đây là cơ chế thay thế việc bắt agent này viết file tóm tắt
  # cho agent kia đọc.
  #
  # Chạy nhanh (~2s) và không cần dịch vụ ngoài → đặt đầu tiên, fail fast.
  # ---------------------------------------------------------------------
  invariants:
    name: Ràng buộc cứng + contract drift
    runs-on: self-hosted
    steps:
      - name: 🔬 ĐO EPHEMERAL — máy này có bị dùng lại không (ADR-037 QĐ3①)
        # Trả lời câu PO đang định hỏi BTC bằng PHÉP ĐO thay vì bằng lời hứa.
        #
        # 🔴 BẤT ĐỐI XỨNG, đừng đọc lệch: phép này CHỈ chứng minh được
        # PERSISTENT. Không đọc được tệp mốc thì KHÔNG kết luận gì — có thể là
        # máy khác, có thể là cùng máy đã dọn, và từ đây không tách được hai
        # khả năng ấy. Vắng mặt không phải bằng chứng.
        #
        # Tên máy `eph-vmrunner2-…` GỢI Ý ephemeral nhưng KHÔNG chứng minh:
        # một cái TÊN không phải một CƠ CHẾ — cùng hình dạng với
        # `CHUAN_HOA_VERSION` (tên là version, không đổi theo nội dung) và
        # `pg_isready` (tên là "sẵn sàng chưa", trả lời "có ai nhận kết nối không").
        #
        # KHAI: bước này GHI vào $HOME của runner DÙNG CHUNG — ~150 byte, không
        # chứa bí mật, tự ghi rõ là xoá được. Đó là cái giá tối thiểu để câu hỏi
        # "máy có bị dùng lại không" trả lời được từ bên trong.
        run: |
          MOC="$HOME/.fin05-moc-ci.txt"
          echo "runner : ${RUNNER_NAME:-(không có RUNNER_NAME)}"
          echo "run_id : ${{ github.run_id }}"
          if [ -f "$MOC" ]; then
            echo "🔴 ĐỌC ĐƯỢC TỆP MỐC ⟹ MÁY BỊ DÙNG LẠI (PERSISTENT). Chứng minh xong:"
            sed 's/^/    /' "$MOC"
          else
            echo "KHÔNG có tệp mốc ⟹ KHÔNG KẾT LUẬN GÌ (không phải bằng chứng ephemeral)."
          fi
          {
            echo "moc-do-ephemeral FIN-05 (ADR-037 QĐ3①) — xoá được, vô hại, không chứa bí mật"
            echo "run_id=${{ github.run_id }} runner=${RUNNER_NAME:-?} luc=$(date -u +%FT%TZ)"
          } >> "$MOC"
          echo "— $MOC nay có $(wc -l < "$MOC") dòng (ĐẾM thật, không phải hiệu số) —"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: scripts/ci_pip_install_retry.sh requirements.lock.txt
      - name: 5 ràng buộc cứng (CLAUDE.md §2)
        run: pytest tests/test_invariants.py -v
        env:
          OPENAI_API_KEY: test-key-not-used-by-unit-tests
          # Tắt tracing: test gọi thẳng tool.invoke() để kiểm chốt chặn OTP,
          # không được để mỗi lần chạy CI bắn trace lên LangSmith.
          LANGCHAIN_TRACING_V2: "false"
          LANGSMITH_TRACING: "false"
      - name: Phát hiện artifact lỗi thời so với contracts/
        run: python scripts/check_contracts.py --verbose

  # ---------------------------------------------------------------------
  # Stage 1: Lint + Unit test
  # ---------------------------------------------------------------------
  lint-and-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: scripts/ci_pip_install_retry.sh requirements.lock.txt
      - name: Lint với ruff
        run: ruff check src/ tests/ eval/
      - name: Chạy toàn bộ pytest (unit + integration, không gọi LLM thật)
        # 🔴 C3 (Lead duyệt 25/08) — `if: !cancelled()` KHÔNG phải nới lỏng cổng.
        #
        # [ĐO] job 97511034... run 32723255736: bước ruff ĐỎ ⟹ bước này bị
        # SKIPPED ⟹ **toàn bộ suite backend chưa từng chạy trong CI một lần
        # nào**. Và nguyên nhân là 17 lỗi ruff, TOÀN BỘ trong `eval/`, chủ yếu
        # N802/N806 (tên biến viết hoa). Một quy ước đặt tên đang giấu kết quả
        # của 657 test — lint và test là HAI TRỤC, trục này không được che trục
        # kia.
        #
        # Job VẪN ĐỎ nếu ruff đỏ (bước ruff giữ nguyên, không `continue-on-
        # error`). Thay đổi DUY NHẤT: pytest luôn báo cáo được kết quả của nó.
        #
        # Dùng `!cancelled()` chứ KHÔNG `always()`: `always()` còn chạy cả khi
        # người ta bấm huỷ run, tức đốt 2 phút runner ephemeral cho một kết quả
        # không ai đọc. Hàng chờ đang có 8 job.
        #
        # ⚠️ Đánh đổi đã khai: bước cài phụ thuộc hỏng thì pytest vẫn chạy và
        # đỏ vì `ModuleNotFoundError` — một thông báo lỗi phục vụ hai nguyên
        # nhân. Chấp nhận: đọc log thấy ngay bước cài đã đỏ trước đó. Rẻ hơn
        # nhiều so với việc giấu mất cả suite.
        if: ${{ !cancelled() }}
        # -m "not security_finding": loại test finding P0 CHƯA VÁ (xem job
        # security-findings-gate bên dưới) — tách riêng để 1 job đỏ có tên rõ
        # ràng, không lẫn vào hàng trăm test bình thường của job này (xem
        # docs/TESTING.md mục "v2 bổ sung" và pytest.ini).
        run: pytest tests/ -v --tb=short -m "not security_finding"
        env:
          OPENAI_API_KEY: test-key-not-used-by-unit-tests

  # ---------------------------------------------------------------------
  # Stage 1c: Migration chain test (FIN05-StressTest-Plan-v4 M4-01/02/03) —
  # rủi ro cao nhất khi deploy domain thật lần đầu (DB production chạy
  # `alembic upgrade head` từ RỖNG). Test SQLite (dùng ở lint-and-test) KHÔNG
  # chứng minh được điều này — Postgres có ràng buộc FK/type chặt hơn nhiều.
  # Dùng GitHub Actions `services:` để có Postgres THẬT trên `localhost` —
  # KHÁC docker-compose.yml của app (service đó cố ý không publish port ra
  # host, xem tests/test_observability/test_network_isolation.py).
  # ---------------------------------------------------------------------
  db-migration-test:
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fin05_ci
          POSTGRES_PASSWORD: fin05-ci-ephemeral-password
          POSTGRES_DB: fin05_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fin05_ci -d fin05_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: scripts/ci_pip_install_retry.sh requirements.lock.txt
      - name: Migration chain test trên Postgres thật
        run: pytest tests/test_migrations/ -v --tb=short
        env:
          DATABASE_URL: postgresql+psycopg2://fin05_ci:fin05-ci-ephemeral-password@localhost:5432/fin05_ci
          OPENAI_API_KEY: test-key-not-used-by-migration-tests

  # ---------------------------------------------------------------------
  # Stage 1d: Frontend lint + typecheck + unit test (FIN05-StressTest-Plan-v4
  # F4-01/F4-02) — phát hiện thật lúc thêm: trước đây CI KHÔNG có bước nào
  # chạy eslint/tsc cho frontend cả (chỉ có `npm audit` ở dependency-and-
  # secret-scan) — lỗi type/lint chỉ bị bắt khi build thật hoặc chạy tay.
  # Vitest (mới, xem vitest.config.ts) TÁCH khỏi Playwright — nhanh, không
  # cần dựng backend/docker compose, chạy được mọi PR.
  # ---------------------------------------------------------------------
  frontend-lint-and-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Lint (eslint)
        run: npm run lint --prefix frontend
      # `next typegen` sinh .next/types/routes.d.ts — nơi khai báo global
      # PageProps<>/LayoutProps<> mà Next 16 dùng cho typed routes. Máy dev có
      # sẵn thư mục này do đã từng `next dev`/`next build`; runner CI thì SẠCH,
      # nên tsc báo "Cannot find name 'PageProps'" dù code không sai. Đây đúng
      # loại lỗi "máy tôi chạy được" mà job CI sinh ra để bắt.
      - name: Sinh type cho typed routes (next typegen)
        run: npx --prefix frontend next typegen frontend
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck --prefix frontend
      - name: Unit test (Vitest)
        run: npm run test:unit --prefix frontend

  # ---------------------------------------------------------------------
  # Stage 1b: Security findings gate (FIN05-StressTest-Plan-v2, P0-1/P0-3/
  # P0-4/P0-5) — CHẶN CI theo đúng chủ đích (quyết định 2026-08-11, xem
  # docs/TESTING.md): các test này FAIL cho tới khi từng finding được vá
  # thật, hoặc chính thức "chấp nhận rủi ro" (cập nhật test theo quyết định,
  # giống cách CVE chromadb đã xử lý — không xoá/skip test).
  # ---------------------------------------------------------------------
  security-findings-gate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: scripts/ci_pip_install_retry.sh requirements.lock.txt
      - name: Test finding bảo mật P0 chưa vá (kỳ vọng ĐỎ cho tới khi vá/chấp nhận rủi ro)
        run: pytest tests/ -v --tb=short -m security_finding
        env:
          OPENAI_API_KEY: test-key-not-used-by-unit-tests

  # ---------------------------------------------------------------------
  # Stage 2: Dependency & secret scan (C5, C7)
  # ---------------------------------------------------------------------
  dependency-and-secret-scan:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks cần full history để quét secret trong các commit cũ
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: scripts/ci_pip_install_retry.sh requirements.lock.txt pip-audit
      - name: Quét CVE gói Python (C7)
        # --ignore-vuln PYSEC-2026-311 (chromadb, CVE-2026-45829,
        # GHSA-f4j7-r4q5-qw2c): code injection pre-auth qua endpoint HTTP
        # /api/v2/tenants/{tenant}/databases/{db}/collections khi
        # trust_remote_code=true — CHỈ khai thác được nếu chạy chromadb như
        # server độc lập. Dự án dùng chromadb.PersistentClient (nhúng trong
        # tiến trình, src/rag/store.py) — KHÔNG có server/port nào cho
        # chroma (xem docker-compose.yml, chỉ mount volume), grep
        # trust_remote_code toàn repo = 0 kết quả -> bề mặt tấn công không
        # tồn tại trong cách triển khai này. CHƯA có bản vá (1.5.9 là bản
        # mới nhất, vẫn trong khoảng ảnh hưởng) nên không thể nâng cấp —
        # xác nhận định kỳ bằng `pip-audit -r requirements.txt` KHÔNG kèm
        # --ignore-vuln, gỡ dòng ignore này ngay khi có bản vá.
        #
        # ─────────────────────────────────────────────────────────────────
        # BA IGNORE THÊM 25/08 — PO THẬT KÝ CHẤP NHẬN RỦI RO (đường A), SAU
        # KHI ĐƯỢC GIẢI THÍCH CẢ RỦI RO CỦA CHÍNH ĐƯỜNG A.
        #   CVE-2026-45830  thiếu kiểm quyền -> đọc/ghi/xoá collection của
        #                   TENANT KHÁC (chỉ qua API HTTP của chroma server)
        #   CVE-2026-45831  SimpleRBACAuthorizationProvider không kiểm
        #                   tenant/database/collection (chỉ ở chế độ server)
        #   CVE-2026-45833  code injection qua trust_remote_code — CÙNG HỌ
        #                   PYSEC-2026-311 ở trên
        # Cả ba: chromadb 1.5.9, cột "Fix Versions" TRỐNG -> KHÔNG CÓ BẢN VÁ
        # ĐỂ NÂNG. Không phải "lười nâng" — không có gì để nâng lên.
        #
        # LÝ DO AN TOÀN — MỘT TIỀN ĐỀ DUY NHẤT: dự án chạy chroma ở CHẾ ĐỘ
        # NHÚNG, không mở cổng, không bật trust_remote_code. Cả ba lỗ chỉ với
        # tới được qua API HTTP của một chroma SERVER.
        #
        # BẰNG CHỨNG ĐO ĐƯỢC (25/08, chạy lại thay vì tin chú thích cũ —
        # chính chú thích PYSEC ở trên là thứ suýt làm tôi khỏi kiểm):
        #   grep -rn trust_remote_code . --include=*.py *.yml *.yaml *.txt
        #        -> 0  (hai kết quả duy nhất LÀ CHÍNH KHỐI CHÚ THÍCH NÀY)
        #   src/rag/store.py:84 -> chromadb.PersistentClient(...)  KHÔNG HttpClient
        #   docker-compose.yml  -> chỉ VOLUME `chroma_data`, KHÔNG service/port chroma
        #   grep SimpleRBAC | CHROMA_SERVER  -> 0
        #
        # 🔴 TIỀN ĐỀ ẤY CÓ THỂ CHẾT, VÀ KHI NÓ CHẾT MẤY DÒNG IGNORE NÀY VẪN
        # NẰM IM. Chú thích KHÔNG KÊU. Nên điều kiện huỷ hiệu lực được cắm
        # thành MỘT CỔNG, không phải một dòng chữ:
        #
        #   tests/test_security/test_chromadb_embedded_premise.py
        #
        # Nó khẳng định đúng ba tiền đề trên, kèm 4 ca ĐỐI CHỨNG chứng minh
        # từng hàm dò thật sự bắt được ca vi phạm và không bắt oan volume
        # `chroma_data`. Ai chuyển sang HttpClient / thêm service chroma /
        # bật trust_remote_code -> TEST ĐỎ -> mấy dòng ignore này TỰ LỘ là đã
        # hết hiệu lực. [ĐO 25/08] 7 passed; PO-agent tự đổi PersistentClient
        # thành HttpClient -> 1 failed, khôi phục -> xanh lại.
        # 🔴 GỠ TEST ẤY = GỠ ĐIỀU KIỆN PO ĐÃ KÝ. Gỡ thì phải gỡ luôn 3 ignore.
        #
        # NGÀY RÀ LẠI: 2026-09-24 (hoặc SỚM HƠN, ngay khi chromadb ra bản vá).
        # Rà bằng: pip-audit KHÔNG kèm --ignore-vuln, đối chiếu "Fix Versions".
        # ─────────────────────────────────────────────────────────────────
        #
        # 🔴 BỎ `--strict` (25/08, PO-agent duyệt) — VÀ VÌ SAO KHÔNG BỎ TRẦN.
        #
        # [ĐO] run 32846571488, bước này, dòng lỗi DUY NHẤT:
        #   ERROR: xx_ent_wiki_sm: Dependency not found on PyPI and could not
        #   be audited (3.8.0)          -> ##[error] exit code 1
        # `xx_ent_wiki_sm` là model spaCy cho Presidio, cài từ URL GitHub THEO
        # THIẾT KẾ (requirements.lock.txt:195, Dockerfile:48) — nó KHÔNG BAO
        # GIỜ có trên PyPI. `--strict` nghĩa là "đỏ nếu THU THẬP phụ thuộc
        # thất bại", nên job chết TRƯỚC KHI quét được gói nào.
        #
        # 🔴 HỆ QUẢ THẬT, nặng hơn chính bản vá: PHÉP QUÉT CVE CHƯA BAO GIỜ
        # CHẠY TỚI ĐOẠN QUÉT — suốt cả thời gian job này tồn tại. Nó chết ở
        # bước THU THẬP và báo ĐỎ, nên đọc ra như "CÓ CVE", trong khi sự thật
        # là "CHƯA ĐO ĐƯỢC GÌ". Hai trạng thái khác hẳn nhau đội chung một vỏ.
        #
        # Bỏ `--strict` TRẦN thì cổng sẽ IM LẶNG với MỌI gói không quét được
        # về sau — đúng tội đã liệt ở CHECKLIST #28 (che mất tín hiệu của
        # chính cái đang hỏng). Nên kèm phép kiểm: dòng "could not be audited"
        # phải xuất hiện ĐÚNG MỘT LẦN và ĐÚNG LÀ `xx_ent_wiki_sm`. Thêm một
        # gói không quét được -> job ĐỎ, không im.
        #
        # `--strict` bỏ đi KHÔNG làm yếu khả năng bắt CVE: pip-audit vẫn thoát
        # khác 0 khi TÌM THẤY lỗ hổng. Chỉ khác ở "không quét được" vs "quét
        # xong, có lỗ".
        #
        # Dùng `set +e` + chuyển hướng ra tệp, KHÔNG dùng `cmd | tee` với
        # PIPESTATUS: shell mặc định của GitHub Actions là `bash -e {0}`, một
        # pipeline hỏng sẽ THOÁT NGAY trước khi kịp đọc mã trả về — mà đây là
        # bước mà mã trả về CHÍNH LÀ thứ ta cần đọc.
        run: |
          set +e
          pip-audit \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833 \
            > /tmp/pip-audit-c7.log 2>&1
          KQ_AUDIT=$?
          set -e
          cat /tmp/pip-audit-c7.log

          KHONG_QUET_DUOC=$(grep -c "could not be audited" /tmp/pip-audit-c7.log || true)
          DUNG_GOI_DA_BIET=$(grep -c "xx_ent_wiki_sm.*could not be audited" /tmp/pip-audit-c7.log || true)
          if [ "$KHONG_QUET_DUOC" -ne "$DUNG_GOI_DA_BIET" ] || [ "$KHONG_QUET_DUOC" -gt 1 ]; then
            echo "::error::C7 — có gói KHÔNG QUÉT ĐƯỢC ngoài xx_ent_wiki_sm."
            echo "::error::  dòng 'could not be audited': $KHONG_QUET_DUOC · khớp xx_ent_wiki_sm: $DUNG_GOI_DA_BIET"
            echo "::error::  Đây KHÔNG phải lỗi vặt: mỗi gói không quét được là một gói CHƯA AI BIẾT có CVE hay không."
            grep "could not be audited" /tmp/pip-audit-c7.log || true
            exit 1
          fi
          if [ "$KHONG_QUET_DUOC" -eq 0 ]; then
            echo "::notice::xx_ent_wiki_sm nay QUÉT ĐƯỢC — gỡ được phép kiểm này khỏi ci.yml."
          fi
          exit "$KQ_AUDIT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Quét CVE gói npm (C7, bổ sung — bản gốc bỏ sót JS side)
        run: npm audit --prefix frontend --audit-level=high
      - name: Quét secret lỡ commit (C5)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # F-MIG — chuỗi migration phải CHẠY ĐƯỢC, và phải khớp với models.py
  #
  # Vì sao cần một job riêng: test suite dựng schema bằng
  # `Base.metadata.create_all()`, KHÔNG qua alembic. Hai đường dựng schema tách
  # biệt và trước bản này chỉ MỘT được canh — chuỗi migration chết ở
  # `a1b2c3d4e5f6` suốt nhiều tháng mà 540 test vẫn xanh (Luật 14: nhánh không
  # gọi được từ test là nhánh không ai canh).
  #
  # Phép 3 (so schema hai đường) là phép quan trọng nhất: nó là thứ DUY NHẤT
  # bắt được drift giữa `models.py` và lịch sử migration. Drift kiểu đó chỉ lộ
  # ở lần deploy Postgres thật đầu tiên — đúng lúc đắt nhất.
  # ---------------------------------------------------------------------
  migration-chain:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: scripts/ci_pip_install_retry.sh requirements.lock.txt
      - name: Phép 1+2 — upgrade head trên DB trắng, rồi hai chiều
        env:
          DATABASE_URL: sqlite:///ci-migration.db
          JWT_SECRET_KEY: ci-dummy-secret-key-0123456789abcd
          REDIS_URL: fake://ci
          OPENAI_API_KEY: ci-dummy
        run: |
          export FIELD_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())")
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Phép 3 — schema từ alembic PHẢI khớp schema từ models.py
        env:
          JWT_SECRET_KEY: ci-dummy-secret-key-0123456789abcd
          REDIS_URL: fake://ci
          OPENAI_API_KEY: ci-dummy
        run: |
          export FIELD_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())")
          python scripts/kiem_schema_hai_duong.py

  # ---------------------------------------------------------------------
  # Stage 3: AppSec test (Nhóm C) — ma trận phân quyền + injection
  # ---------------------------------------------------------------------
  appsec:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: scripts/ci_pip_install_retry.sh requirements.lock.txt
      - name: Chạy test API (phân quyền + injection)
        # -m "not security_finding": CÙNG bộ lọc với job lint-and-test (:103).
        # Thiếu nó, job này bắt luôn ST2-P0-3 (finding P0 live-chat PII còn
        # đang MỞ, cố ý đỏ ở job security-findings-gate) → "AppSec" đỏ vĩnh
        # viễn vì một lỗ ĐÃ CÓ job riêng canh, không phải vì phân quyền hay
        # injection hỏng. Một job đỏ vì lý do sai còn tệ hơn không có job:
        # nó dạy người đọc bỏ qua màu đỏ.
        # CẤM "sửa" bằng cách gỡ mark security_finding khỏi ST2-P0-3 — làm
        # thế thì CI xanh mà lỗ vẫn hở, đúng thứ hai lớp job này tách ra để
        # tránh.
        run: pytest tests/test_api/ -v -m "not security_finding"
        env:
          OPENAI_API_KEY: test-key-not-used-by-authz-tests

  # ---------------------------------------------------------------------
  # Stage 4: Business rule test (Nhóm A) — TOÀN BỘ golden_set.jsonl (120
  # case) + 3 bộ chuyển thể từ FIN05_QA_TestCases.jsonl (functional/fraud/err
  # _qa_set — cùng schema/harness, không cắt phạm vi), mỗi case gọi OpenAI
  # thật. Cần secret OPENAI_API_KEY thật.
  # ---------------------------------------------------------------------
  business-rules-golden-set:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' }} # Stage 6 (nightly) không cần chạy lại stage này
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: scripts/ci_pip_install_retry.sh requirements.lock.txt
      # data/generated/ nằm trong .gitignore (đúng — 60k giao dịch không thuộc
      # về git). Runner sạch không có nó, nên eval chết ở FileNotFoundError
      # TRƯỚC KHI kịp gọi LLM: job đỏ vì thiếu dữ liệu chứ không phải vì agent
      # trả lời sai. Seed cố định 20260802 -> tái tạo y hệt, offline, ~20s.
      # `--eval-out` BẮT BUỘC, không được dùng `make data` trần: eval_dir của
      # gen_dataset.py mặc định là ROOT/eval, nên nó GHI ĐÈ eval/golden_set.jsonl
      # bất kể `--out` trỏ đi đâu. golden_set trong repo có các nhãn kiểm được
      # thêm tay và PO duyệt (must_offer_before_creating_ticket...); sinh lại sẽ
      # XOÁ SẠCH chúng — CI sẽ chấm bằng một cái thước ngắn hơn thước thật mà
      # không báo gì. Đẩy bản sinh ra sang thư mục vứt đi để thước trong repo
      # bất động.
      - name: Sinh lại data/generated (seed cố định, KHÔNG đụng eval/)
        run: python3 scripts/gen_dataset.py --seed 20260802 --out data/generated/ --eval-out "${RUNNER_TEMP}/eval-vut-di/"
      - run: python eval/run_golden_set.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: python eval/run_golden_set.py --file eval/functional_qa_set.jsonl
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: python eval/run_golden_set.py --file eval/fraud_qa_set.jsonl
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: python eval/run_golden_set.py --file eval/err_qa_set.jsonl
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-set-report
          path: eval/results/golden_run_*.md

  # ---------------------------------------------------------------------
  # Stage 5: AI safety adversarial suite (Nhóm B) — 45 case (40 gốc +
  # ADV-041..045 SEC-001/SEC-007/AUTH-002/AUTH-003), gọi OpenAI thật. Cộng
  # llm_judge_set (case ux_tone không kiểm được bằng code).
  # ---------------------------------------------------------------------
  ai-safety-adversarial:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: scripts/ci_pip_install_retry.sh requirements.lock.txt
      # Cùng lý do như job business-rules-golden-set ở trên.
      # `--eval-out` BẮT BUỘC, không được dùng `make data` trần: eval_dir của
      # gen_dataset.py mặc định là ROOT/eval, nên nó GHI ĐÈ eval/golden_set.jsonl
      # bất kể `--out` trỏ đi đâu. golden_set trong repo có các nhãn kiểm được
      # thêm tay và PO duyệt (must_offer_before_creating_ticket...); sinh lại sẽ
      # XOÁ SẠCH chúng — CI sẽ chấm bằng một cái thước ngắn hơn thước thật mà
      # không báo gì. Đẩy bản sinh ra sang thư mục vứt đi để thước trong repo
      # bất động.
      - name: Sinh lại data/generated (seed cố định, KHÔNG đụng eval/)
        run: python3 scripts/gen_dataset.py --seed 20260802 --out data/generated/ --eval-out "${RUNNER_TEMP}/eval-vut-di/"
      - run: python eval/run_adversarial_set.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: python eval/run_llm_judge_set.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adversarial-set-report
          path: |
            eval/results/adversarial_run_*.md
            eval/results/llm_judge_run_*.md

  # ---------------------------------------------------------------------
  # Stage 6: Load/chaos test (Nhóm D) — CHỈ chạy nightly (schedule) hoặc bấm
  # tay (workflow_dispatch), KHÔNG chạy trên PR — đúng bản gốc mục 8: tốn
  # thời gian thật (cần server sống + nhiều phút chạy), không phải giảm phạm
  # vi. D3 (soak 1-2h thật) không chạy tự động ở đây — chạy thủ công theo
  # hướng dẫn trong tests/load/locustfile.py trước milestone lớn.
  # ---------------------------------------------------------------------
  load-test-nightly:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: scripts/ci_pip_install_retry.sh requirements.lock.txt locust
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Khởi động backend + seed dữ liệu tối thiểu
        run: |
          python -m alembic upgrade head
          python scripts/seed_db.py
          nohup uvicorn src.api.main:app --host 0.0.0.0 --port 8010 &
          sleep 5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Build + khởi động frontend (locustfile nhắm /api/* qua BFF, đúng đường đi thật)
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          BACKEND_URL=http://localhost:8010 nohup npm run start --prefix frontend -- -p 3000 &
          sleep 8
      - name: D1+D2 rút gọn (vài phút, không phải soak 1-2h) qua BFF
        run: |
          locust -f tests/load/locustfile.py --host http://localhost:3000 \
            --headless -u 30 -r 5 --run-time 5m --csv=eval/results/load_nightly
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: eval/results/load_nightly*

  # ---------------------------------------------------------------------
  # Stage 7: Playwright e2e (Nhóm identity/AUTH-*, FIN05_QA_TestCases.jsonl)
  # — cần dựng đủ backend THẬT + frontend THẬT (không mock), giống Stage 6,
  # nên CHỈ chạy nightly/tay, không chạy trên mọi PR. OTP giờ được backend
  # xác thực thật (src/auth.py::require_otp_verified) — test này xác nhận
  # toàn bộ chuỗi browser → BFF → FastAPI, không chỉ riêng logic backend.
  # ---------------------------------------------------------------------
  e2e-playwright-nightly:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: scripts/ci_pip_install_retry.sh requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Khởi động backend + seed dữ liệu
        run: |
          python -m alembic upgrade head
          python scripts/seed_db.py
          nohup uvicorn src.api.main:app --host 0.0.0.0 --port 8010 &
          sleep 5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Build + khởi động frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          BACKEND_URL=http://localhost:8010 nohup npm run start --prefix frontend -- -p 3000 &
          sleep 8
      - name: Cài Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Chạy Playwright (nhóm AUTH-*)
        run: npx --prefix frontend playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # ---------------------------------------------------------------------
  # Stage 8: Live-chat E2E (FIN05-StressTest-Plan-v4 L4-01..L4-05) — KHÁC
  # Stage 7 (uvicorn/npm trần, không có Caddy): live-chat CẦN mạng Docker
  # thật (`docker compose up`, Caddy → backend) để /ws/live-chat route đúng
  # — bug thật (tin nhắn lặp, session mồ côi, dashboard không realtime) chỉ
  # lộ ra qua đúng topology này (xem playwright.livechat.config.ts). Nightly
  # only — build + khởi động cả 5 service tốn thời gian thật.
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Stage 3b: Bộ quét vai × trang TRÊN STACK DOCKER THẬT (C2 lỗ 2 của QA).
  #
  # Vì sao phải có job riêng có Docker: tests/test_api/test_frontend_route_guards.py
  # tự `skip` khi không tới được https://localhost. Trước job này, KHÔNG job CI
  # nào dựng stack ⟹ bộ quét 24 ô CHƯA BAO GIỜ chạy ở CI, chỉ xanh trên máy một
  # người. Mà đây đúng là lớp lỗi nó sinh ra để canh: guard frontend hẹp hơn
  # contract — đã xảy ra BA lần.
  #
  # ĐIỀU KIỆN CỦA QA, quan trọng hơn cả việc job tồn tại: SKIP PHẢI ĐỎ. Skip ở
  # đây nghĩa là "không dựng được stack" — tức CHƯA ĐO GÌ CẢ, không phải "đo
  # xong và ổn". Một job xanh nhờ skip còn tệ hơn không có job: nó phát ra tín
  # hiệu an toàn mà không có gì chống đỡ.
  # ---------------------------------------------------------------------
  route-guards-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cần lịch sử để so nhánh, xem bước dưới
      - name: Xét có cần chạy không (đụng frontend/src hoặc contracts)
        id: xet
        # Tự tính bằng git thay vì dùng action lọc path của bên thứ ba: bớt một
        # phụ thuộc chuỗi cung ứng cho đúng nguyên tắc đã ghim ở playbook.
        # FAIL-SAFE THEO HƯỚNG CHẠY: không xác định được diff (push đầu tiên,
        # force-push, lịch sử nông) thì CHẠY, không phải bỏ qua. Cổng an toàn
        # mà nghi ngờ thì phải nghiêng về phía kiểm, không nghiêng về phía bỏ.
        run: |
          set -u
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "chay=co" >> "$GITHUB_OUTPUT"; echo "Lý do: chạy theo lịch/bấm tay"; exit 0
          fi
          GOC="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$GOC" ] || ! git cat-file -e "$GOC^{commit}" 2>/dev/null; then
            echo "chay=co" >> "$GITHUB_OUTPUT"; echo "Lý do: không xác định được mốc so sánh -> chạy cho chắc"; exit 0
          fi
          DOI=$(git diff --name-only "$GOC" "${{ github.sha }}" || true)
          echo "File đã đổi:"; echo "$DOI"
          if echo "$DOI" | grep -qE '^(frontend/src/|contracts/|tests/test_api/test_frontend_route_guards\.py)'; then
            echo "chay=co" >> "$GITHUB_OUTPUT"
          else
            echo "chay=khong" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.xet.outputs.chay == 'co'
        with:
          python-version: "3.12"
          cache: pip
      - run: scripts/ci_pip_install_retry.sh requirements.lock.txt
        if: steps.xet.outputs.chay == 'co'
      - name: Tạo .env cho docker compose (giá trị CI ephemeral)
        if: steps.xet.outputs.chay == 'co'
        run: |
          cat > .env <<EOF
          POSTGRES_USER=fin05_ci
          POSTGRES_PASSWORD=fin05-ci-ephemeral-password
          POSTGRES_DB=fin05_ci
          JWT_SECRET_KEY=ci-ephemeral-not-for-production-use-only-in-ci-runs
          FIELD_ENCRYPTION_KEY=Y2ktZXBoZW1lcmFsLWtleS1ub3QtZm9yLXByb2QtMzI=
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          SITE_DOMAIN=localhost
          EOF
      - name: 🔴 Tiền kiểm CỔNG — tách "đỏ vì đụng cổng" khỏi "đỏ vì code"
        if: steps.xet.outputs.chay == 'co'
        # `-p` đổi TÊN PROJECT, KHÔNG đổi cổng host: docker-compose.yml ghim cứng
        # caddy "80:80"/"443:443" (+ postgres 5432, jaeger 16686 trên loopback).
        # Trên runner DÙNG CHUNG, bốn cổng ấy là tài nguyên độc quyền của cả máy.
        # Đọc /proc/net/tcp thay vì `ss`/`lsof`: hai công cụ đó có thể không có
        # trên runner lạ, còn /proc là tệp — không phụ thuộc gì.
        run: |
          python3 - <<'PY'
          import sys
          CAN = {80: "caddy", 443: "caddy", 5432: "postgres", 16686: "jaeger"}
          nghe = set()
          for f in ("/proc/net/tcp", "/proc/net/tcp6"):
              try:
                  for hang in open(f).read().splitlines()[1:]:
                      c = hang.split()
                      if c[3] == "0A":  # 0A = LISTEN
                          nghe.add(int(c[1].split(":")[1], 16))
              except FileNotFoundError:
                  print(f"KHÔNG ĐỌC ĐƯỢC {f} — bỏ qua tệp này (không kết luận gì từ nó)")
          ban = sorted(p for p in CAN if p in nghe)
          print(f"cần: {sorted(CAN)} · đang có người nghe: {ban or 'không cổng nào'}")
          if ban:
              sys.exit(
                  "🔴 ĐỎ VÌ ĐỤNG CỔNG — KHÔNG PHẢI ĐỎ VÌ CODE.\n"
                  f"Bị chiếm: {ban} ({', '.join(CAN[p] for p in ban)}).\n"
                  "Máy dùng chung: hoặc team khác đang chạy, hoặc một lượt CI trước\n"
                  "chưa được dọn. ĐỪNG đi tìm bug trong src/."
              )
          print("Không cổng nào bị chiếm ⟹ bước sau mà đỏ thì KHÔNG phải vì đụng cổng.")
          PY
      - name: docker compose up + chờ healthy
        if: steps.xet.outputs.chay == 'co'
        run: |
          docker compose -p fin05-ci-${{ github.run_id }} up -d --build
          for i in $(seq 1 30); do
            unhealthy=$(docker compose -p fin05-ci-${{ github.run_id }} ps --format json | python3 -c "
          import json, sys
          rows = [json.loads(l) for l in sys.stdin]
          print(sum(1 for r in rows if r.get('Health') not in ('healthy', '')))
          ")
            [ "$unhealthy" = "0" ] && break
            sleep 5
          done
      - name: Seed dữ liệu demo (bộ quét cần đăng nhập được 4 vai)
        if: steps.xet.outputs.chay == 'co'
        run: docker compose -p fin05-ci-${{ github.run_id }} exec -T backend su appuser -c "python3 scripts/seed_db.py" || true
      - name: Bộ quét vai × trang
        if: steps.xet.outputs.chay == 'co'
        run: pytest tests/test_api/test_frontend_route_guards.py -v --junitxml=route-guards.xml
      - name: SKIP LÀ ĐỎ — xác nhận bộ quét thật sự đã chạy
        if: steps.xet.outputs.chay == 'co'
        # Bước này tồn tại vì pytest KHÔNG có cách nào biến skip thành fail:
        # `pytest.skip(allow_module_level=True)` của bộ quét luôn cho exit 0, nên
        # bước trên XANH kể cả khi 0 ô nào được kiểm. Đọc junit XML là cách duy
        # nhất phân biệt "đo xong, đạt" với "chưa đo gì".
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          ts = ET.parse("route-guards.xml").getroot()
          suite = ts if ts.tag == "testsuite" else ts.find("testsuite")
          tong = int(suite.get("tests", 0)); bo_qua = int(suite.get("skipped", 0))
          print(f"tổng={tong} bỏ_qua={bo_qua}")
          if tong == 0 or bo_qua:
              sys.exit(
                  "BỘ QUÉT KHÔNG CHẠY THẬT: không dựng được stack Docker nên test tự skip.\n"
                  "Skip ở đây = CHƯA ĐO GÌ, không phải 'đo xong và ổn'. Xem log docker bên dưới."
              )
          print("Bộ quét đã chạy thật, không ô nào bị bỏ qua.")
          PY
      - name: Docker logs (khi fail, để debug)
        if: failure() && steps.xet.outputs.chay == 'co'
        run: docker compose -p fin05-ci-${{ github.run_id }} logs --tail=200

      - name: 🔒 DỌN — xoá .env chứa khoá THẬT + hạ container
        # 🔴 `if: always()` TRẦN, cố ý KHÔNG kèm guard nào. Bước dọn phải chạy
        # cả khi job bị huỷ giữa chừng hoặc guard đổi về sau — đó đúng là lúc
        # cần nó nhất. `rm -f` trên tệp không có là vô hại.
        #
        # `down -v` ĐÚNG Ở ĐÂY, đừng nhầm với luật cấm `-v` ở máy PO: nhờ
        # `-p fin05-ci-<run_id>` tên project là DUY NHẤT theo từng lượt, nên -v
        # chỉ xoá volume của chính lượt này. Bỏ volume lại trên máy dùng chung
        # là bỏ lại CSDL của lượt CI cho team khác.
        if: always()
        run: |
          docker compose -p fin05-ci-${{ github.run_id }} down -v --remove-orphans || true
          rm -f .env
          echo "— còn .env không? —"
          ls -la .env 2>/dev/null && echo "🔴 VẪN CÒN .env" || echo "  không còn (đúng)"
  livechat-e2e-nightly:
