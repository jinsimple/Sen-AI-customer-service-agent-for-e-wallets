[pytest]
markers =
    security_finding: finding bảo mật P0 CHƯA VÁ (FIN05-StressTest-Plan-v2, docs/TESTING.md mục "v2 bổ sung") — cố ý fail làm bằng chứng, chạy riêng ở CI job security-findings-gate (ci.yml), TÁCH khỏi lint-and-test để không lẫn với test thường.
    slow: test phải chạy tiến trình thật nên tính bằng CHỤC GIÂY, không phải mili giây (vd test_thuoc_bat_dong chạy hẳn gen_dataset ~40s để chứng minh guard hoạt động trên hành vi thật, không phải trên mock). Lọc bằng `-m "not slow"` khi cần vòng lặp nhanh lúc dev; CI vẫn chạy ĐỦ, không được lấy marker này làm cớ bỏ bớt phạm vi. Lưu ý: gắn marker CHƯA khai báo ở đây chỉ sinh cảnh báo chứ không lọc được — đó là lý do dòng này phải tồn tại trước khi ai đó gắn.

