name: fin05

# Bảo mật mạng: CHỈ service `caddy` publish port ra host (80/443). backend/
# frontend/postgres không có `ports:` nào — không container nào trong 3 service
# đó chạm được từ bên ngoài Docker, chỉ gọi nhau qua tên service trong mạng nội
# bộ compose tạo sẵn. Đây là lớp bảo vệ network-level bổ sung cho thiết kế BFF
# đã có (frontend là điểm gọi FastAPI duy nhất) — xem docs/DEPLOY.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Publish CHỈ trên loopback (127.0.0.1), KHÔNG phải 0.0.0.0 — script chạy
    # trên host (seed, load test, verify_security.sh, migration tay) cần nối
    # được vào ĐÚNG database mà app đang dùng, thay vì âm thầm rơi về SQLite
    # riêng và làm dữ liệu tách đôi (ADR-013). Bind loopback nên không lộ ra
    # mạng LAN/Internet — vẫn giữ nguyên tắc "chỉ caddy publish ra ngoài" cho
    # traffic người dùng.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Revocation store JWT refresh token + rate-limit dùng chung (login/OTP/
    # live-chat, đợt nâng cấp Auth Flow 2026-08-12) — src/redis_client.py.
    # KHÔNG có `ports:` — cùng nguyên tắc "chỉ caddy publish port" ở đầu file.
    #
    # 🔴🔴 ĐỌC TRƯỚC KHI THÊM `ports:` VÀO ĐÂY — REDIS NÀY KHÔNG CÓ MẬT KHẨU.
    # [ĐO 25/08] `grep -r 'requirepass\|REDIS_PASSWORD'` trên `docker-compose*.yml`,
    # `src/config.py`, `.env.example` → **0 kết quả, không ở đâu cả.**
    #
    # Hôm nay điều đó CHƯA phải lỗ đang mở: không `ports:` ⟹ chỉ với tới được từ
    # trong mạng compose. Nó thành lỗ khi có BẤT KỲ điều nào sau:
    #   · thêm `ports:` (kể cả `127.0.0.1:…`) — host dùng chung là host của người khác
    #   · một container THỨ BA vào cùng mạng
    #   · chạy trên máy dùng chung nhiều dự án
    # 🔴 Trường hợp thứ nhất đáng lo nhất vì **nó không đòi ai làm gì sai** — chỉ cần
    # MỘT người không biết dòng này tồn tại. Đó là lý do cảnh báo nằm ở ĐÂY, ngay chỗ
    # người ấy sẽ gõ, chứ không nằm trong `docs/`.
    #
    # Redis nay có `appendonly yes` + volume ⟹ dữ liệu SỐNG QUA khởi động lại, nên
    # cửa sổ phơi nhiễm cũng không còn tự dọn theo vòng đời container như trước.
    #
    # ⚠️ VÌ SAO CHƯA VÁ: phạm vi PO trình PO thật CÓ vế "thêm mật khẩu", nhưng vế ấy
    # **chưa bao giờ được land vào repo** — nó sống trong tin nhắn, nên khi Coder
    # dựng lại phạm vi từ nguồn tra được (CHECKLIST) thì **rơi mất im lặng**. PO tự
    # khai 25/08. Ghi vào ĐÂY để nó không rơi lần thứ hai.
    # Treo có chủ đích: đợt đang đóng, thêm một thay đổi hạ tầng nữa là mở mặt trận mới.
    image: redis:7-alpine
    restart: unless-stopped
    # 🔴 BỀN HOÁ (PO thật duyệt 25/08). TRƯỚC bản này Redis KHÔNG có volume và
    # `appendonly no` ⟹ mất sạch dữ liệu mỗi lần gỡ container.
    #
    # [ĐO 25/08 trên ngăn đang chạy] Redis đang giữ ba loại, và HỆ QUẢ MẤT KHÁC
    # NHAU — đừng gộp làm một:
    #   35 khoá `refresh:*`            → mất ⟹ FAIL-CLOSED. `rotate_refresh_token`
    #     (`auth.py:172-174`) không tìm thấy bản ghi thì TỪ CHỐI token. Hậu quả là
    #     mọi người phải ĐĂNG NHẬP LẠI — phiền, **KHÔNG phải lỗ bảo mật**. Nói rõ
    #     vì rất dễ bán bản vá này thành "vá bảo mật"; nó không phải.
    #   `fin05:chi_tieu_llm_token:*`   → 🔴 ĐÂY MỚI LÀ THỨ ĐÁNG VÁ. Trần chi tiêu
    #     LLM tính THEO NGÀY (`cong_ra_ngoai.py::_khoa_chi_tieu_hom_nay`). Mất ⟹
    #     bộ đếm về 0 ⟹ **trần ngày QUÊN phần đã tiêu**, và nó quên IM LẶNG. Với
    #     một dự án mà ràng buộc vận hành số một là ngân sách token, đó là cổng
    #     chi phí tự mở lại sau mỗi lần khởi động lại.
    #   `fin05:thread_signal:*`        → mất ⟹ fail-safe (cổng tất định chạy lại
    #     như lượt đầu). Khách có thể bị hỏi lại một lần. Phiền, không hỏng.
    #
    # `appendonly yes` chứ không dựa RDB: `save 3600 1 300 100 60 10000` có thể bỏ
    # rơi tới một giờ ghi cuối, mà bộ đếm chi tiêu đúng là thứ đổi liên tục.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # Dấu vật. `:-khong-ro` là fallback TỰ TỐ CÁO: build tay không export
      # biến thì /health nói thẳng "khong-ro", không giả vờ có nhãn.
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-khong-ro}
        BUILD_AT: ${BUILD_AT:-khong-ro}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Ghép từ POSTGRES_* trong .env — không set DATABASE_URL tay ở .env,
      # tránh lệch với `postgres` service ở trên (single source of truth).
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Ghi đè REDIS_URL=fake://local-dev của .env (dùng cho `make run` ngoài
      # docker) bằng Redis thật của service bên trên.
      REDIS_URL: redis://redis:6379/0
      # DNS nội bộ compose — `jaeger` resolve tới service bên dưới, không
      # phải localhost. Backend graceful-degrade nếu jaeger chưa sẵn sàng lúc
      # khởi động (src/observability/tracing.py — BatchSpanProcessor tự
      # retry/nuốt lỗi ở background thread, KHÔNG chặn healthcheck).
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      # T1 · phân luồng. Cờ đọc LÚC IMPORT ⟹ đổi nó bắt buộc phải RECREATE
      # container, `docker exec -e` chỉ đổi tiến trình con và KHÔNG chạm
      # uvicorn đang phục vụ (tester bắt được đúng bẫy này 17/08).
      # BẬT MẶC ĐỊNH từ 17/08 (PO thật chốt, A1). Trước đó mặc định TẮT vì
      # chưa có số; giờ có: lượt đường-nhẹ = 0 token · 0,06s, so với 6.216
      # token · 8,7s cùng câu đi đường đầy đủ. Tiết kiệm TẤT ĐỊNH, không phụ
      # thuộc hành vi model.
      # Đặt `PHAN_LUONG_BAT=0` để tắt cho một ngăn xếp cụ thể.
      PHAN_LUONG_BAT: ${PHAN_LUONG_BAT:-1}
      # Chốt chặn chi phí ở tầng TRANSPORT (`src/cong_ra_ngoai.py`). MỌI lời gọi
      # tới nhà cung cấp — chat LẪN embedding — đi qua đúng một `httpx.Client`
      # dùng chung và bị hỏi cờ này TRƯỚC khi ra dây.
      #
      # 🔴 DÒNG NÀY PHẢI CÓ TRƯỚC khi mặc định của cờ được đảo thành TỪ CHỐI
      # trong `src/`. Hai nửa có thứ tự an toàn MỘT CHIỀU (ADR-035):
      #     dán dòng này mà chưa đảo mặc định  -> VÔ HẠI, hành vi y hệt
      #     đảo mặc định mà chưa có dòng này   -> SẢN PHẨM CHẾT ở lần dựng tới
      #                                          (mọi lượt chat VÀ mọi lượt
      #                                           embedding bị chính chốt chặn
      #                                           của ta từ chối)
      #
      # Cờ đọc LÚC IMPORT ⟹ đổi nó bắt buộc RECREATE. `docker exec -e` chỉ đổi
      # tiến trình con, KHÔNG chạm uvicorn đang phục vụ — cùng bẫy đã ghi ở
      # `PHAN_LUONG_BAT` ngay trên (tester bắt được 17/08).
      #
      # Vì sao `${VAR:-1}` chứ không gõ cứng `1`: ai muốn một ngăn xếp TUYỆT ĐỐI
      # không gọi ra ngoài (vd đo offline) thì đặt biến, KHÔNG phải sửa file —
      # cùng khuôn `PHAN_LUONG_BAT`, không đúc quy ước thứ hai.
      #
      # ⚠️ MỘT CHỖ LÀ ĐỦ CHO CẢ BA NGĂN XẾP: [ĐO] `docker-compose.ttl-test.yml`
      # và `docker-compose.do.yml` chỉ CHỒNG THÊM biến riêng
      # (`JWT_ACCESS_EXPIRE_MINUTES`, `APP_ENV`), không thay cả khối
      # `environment` — nên đừng chép dòng này sang hai file kia.
      FIN05_CHO_PHEP_GOI_RA_NGOAI: ${FIN05_CHO_PHEP_GOI_RA_NGOAI:-1}
      # Số tổng đài khách được đọc khi agent hỏng ở nhóm "cần can thiệp".
      # Bộ kiểm ở `config.py` là phép thử KHẲNG ĐỊNH (bấm được không), không
      # phải danh sách chặn — placeholder kiểu "1900-XXXX (SỐ TẠM)" tự rớt.
      HOTLINE_CSKH: ${HOTLINE_CSKH:-19000000}
      # 🔴 GHIM NGÀY, không dùng nhãn động `qwen3.7-plus`: nhãn động để nhà
      # cung cấp đổi model dưới chân ta, và MỌI SỐ ĐO âm thầm hết hạn. Ta đã
      # ghim mã (`bam_ma_nguon`) và ghim ảnh (`BUILD_COMMIT`) — đây là vật thứ
      # ba cùng lớp, trước nay chưa ghim.
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-plus-2026-05-26}
      # Mặc định cho LLM_BASE_URL — DevOps soát và duyệt 27/08 sau khi tự đo.
      # Vì sao cần: thiếu nó thì SDK rơi về đích MẶC ĐỊNH (api.openai.com) trong
      # khi LLM_MODEL đã là tên model DashScope ⟹ hai nửa cấu hình đến từ hai
      # nguồn, một nửa có lưới an toàn (dòng trên), nửa kia không. Cấu hình
      # TRÔNG đầy đủ vì nửa hỏng KHÔNG để lại chỗ trống — đó là cách sự cố
      # "CI chấm điểm bằng gpt-4o-mini suốt 10 ngày" im lặng được lâu đến vậy.
      # ⚠️ Bản vá này BẮT BUỘC đi kèm LLM_API_KEY trong .env của hai job CI dùng
      # `docker compose up` (route-guards-docker · livechat-e2e-nightly): đặt
      # base_url mà thiếu khoá ⟹ config.py:342 ném lỗi lúc import ⟹ backend chết
      # ở `up -d`. Land riêng một nửa là làm đỏ hai job đang xanh.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      # Suy luận TẮT mặc định — xem lý lẽ đo được ở src/config.py (T3).
      # Bật lại để đo chất lượng: SUY_LUAN_BAT=1, rồi RECREATE (đọc lúc import).
      SUY_LUAN_BAT: ${SUY_LUAN_BAT:-0}
      # Ghi đè SSL_CERT_FILE của .env — CÙNG LÝ DO với REDIS_URL ở trên, nhưng
      # hậu quả nặng hơn nhiều nên ghi kỹ.
      #
      # `.env` đặt SSL_CERT_FILE = đường dẫn certifi của Python 3.14 TRÊN MÁY
      # HOST (/Library/Frameworks/... — macOS). Nó ĐÚNG và CẦN cho hook pre-push
      # AI-log chạy trên host (thiếu là trượt CERTIFICATE_VERIFY_FAILED, đã đo
      # thật). Nhưng `env_file: .env` nạp nó vào CẢ container, nơi Python là
      # 3.12 ở /install và không tồn tại /Library/Frameworks nào.
      #
      # Hậu quả đo được: `ChatOpenAI(...)` -> httpx `create_ssl_context` ->
      # `ssl.create_default_context(cafile=os.environ["SSL_CERT_FILE"])` ->
      # FileNotFoundError -> MỌI lượt chat agent trả HTTP 500 trong ~0,06s
      # (chết trước khi kịp gọi OpenAI).
      #
      # VÌ SAO NÓ KHÔNG LỘ RA SỚM: `/health` không chạm OpenAI, nên container
      # vẫn healthy và `docker ps` vẫn xanh 6/6. Mọi dấu hiệu nói stack khoẻ
      # trong khi đường đắt nhất đã chết — hiện-diện ≠ hiệu-lực ở tầng hạ tầng.
      #
      # Sửa ở ĐÂY chứ không sửa `.env`: `.env` phải giữ đường dẫn host cho hook
      # AI-log. Biến này là thứ HOST cần và CONTAINER phải ghi đè, không phải
      # thứ một trong hai bên sai.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - chroma_data:/app/data/rag_index
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  jaeger:
    # all-in-one: nhận trace qua OTLP (4317 gRPC), có UI xem trace (16686) —
    # đủ cho demo/dự án 1 service, không cần tách Collector/Query/Storage
    # riêng như triển khai Jaeger quy mô lớn.
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # CHỈ bind loopback (127.0.0.1), KHÔNG "16686:16686" (= mọi interface)
      # — đúng nguyên tắc "chỉ caddy publish port ra ngoài" ở đầu file: UI
      # Jaeger chứa nội dung trace (đã scrub PII nhưng vẫn là dữ liệu nội bộ)
      # không nên public. Xem trên VPS thật qua SSH tunnel:
      # `ssh -L 16686:localhost:16686 user@host` rồi mở localhost:16686 máy mình.
      - "127.0.0.1:16686:16686"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Tên service Docker Compose (`backend`) resolve qua DNS nội bộ — KHÔNG
      # phải localhost. Route handler (server-api.ts) đọc biến này lúc chạy
      # request thật, nên không cần build lại image khi đổi.
      BACKEND_URL: http://backend:8010
    depends_on:
      backend:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Cloudflare Tunnel — CHỈ chạy khi bật `--profile home`.
  #
  # Vì sao tunnel chứ không mở port: máy ở nhà tại VN gần như chắc chắn nằm
  # sau CGNAT (không có IP công khai riêng), nên forward port trên router
  # KHÔNG đủ. cloudflared mở kết nối ĐI RA tới Cloudflare rồi giữ nó — không
  # cần IP công khai, không mở một cổng vào nào. Bề mặt tấn công nhỏ hơn hẳn
  # so với chĩa 443 thẳng vào máy nhà.
  #
  # `profiles: ["home"]` là thứ giữ lời hứa "máy dev không đổi hành vi một
  # li": `docker compose up -d` như cũ KHÔNG kéo service này theo. Phải gõ
  # `--profile home` mới có.
  #
  # FAIL-FAST NẰM Ở `scripts/deploy_home.*`, KHÔNG Ở ĐÂY — và đây là một chỗ
  # phản trực giác, đo mới ra:
  #
  # Cách hiển nhiên là `${CLOUDFLARE_TUNNEL_TOKEN:?...}` (12-factor: secret
  # không default, thiếu là chết ngay). NHƯNG `docker compose` NỘI SUY BIẾN
  # CHO MỌI SERVICE TRONG FILE, KỂ CẢ SERVICE BỊ PROFILE LOẠI RA. Đo thật:
  #     env -u CLOUDFLARE_TUNNEL_TOKEN docker compose config --services
  #       -> error: required variable CLOUDFLARE_TUNNEL_TOKEN is missing
  # Tức `docker compose up -d` THƯỜNG trên máy Mac của PO sẽ CHẾT, dù họ
  # không hề bật profile `home`. Đúng thứ ràng buộc "máy dev không đổi hành
  # vi một li" cấm.
  #
  # Nên: ở đây để trống được, còn fail-fast chuyển sang script deploy — cửa
  # DUY NHẤT của đường home. Không mất tính chất "thiếu token là dừng, có
  # thông báo rõ", chỉ đổi chỗ đặt cổng cho đúng phạm vi.
  cloudflared:
    image: cloudflare/cloudflared:2025.2.0
    profiles: ["home"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    # KHÔNG publish cổng nào: tunnel chỉ nói chuyện RA NGOÀI tới Cloudflare và
    # VÀO TRONG tới `caddy:80` qua mạng nội bộ compose.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # [01/09] MẶC ĐỊNH loopback-only (127.0.0.1), CÙNG KHUÔN postgres/jaeger ở
    # trên — trước bản này port TRẦN ("80:80") = bind mọi interface (0.0.0.0),
    # tức publish ra LAN/WiFi cho MỌI ngăn dựng từ file này, kể cả ngăn dev
    # tạm trên máy nhiều người dùng chung (đo được 01/09: qa-stripe VÀ po-demo
    # cùng hở vì cùng thừa hưởng gốc này — sửa GỐC để ngăn thứ tư sau này tự
    # đúng, không cần ai nhớ).
    # 🔴 KHÔNG hardcode 127.0.0.1 tuyệt đối — VPS công khai thật (docs/DEPLOY.md,
    # ĐƯỜNG 1 "IP công khai") CẦN bind mọi interface để khách truy cập được từ
    # ngoài. Cùng khuôn `SITE_DOMAIN:-localhost` đã dùng ngay dưới: mặc định AN
    # TOÀN cho dev, ai deploy thật phải TỰ Ý đặt `CADDY_BIND_HOST=0.0.0.0` (một
    # quyết định HIỆN, không phải mặc định ngầm). Đường Cloudflare Tunnel
    # (`--profile home`) KHÔNG cần đổi biến này — cloudflared nói chuyện với
    # caddy qua mạng nội bộ compose, không qua port publish này (xem khối
    # `cloudflared` bên dưới).
    ports:
      - "${CADDY_BIND_HOST:-127.0.0.1}:80:80"
      - "${CADDY_BIND_HOST:-127.0.0.1}:443:443"
    environment:
      # Mặc định "localhost" để `docker compose up` chạy thử cục bộ không cần
      # domain/internet thật (Caddy tự dùng chứng chỉ nội bộ cho localhost).
      # Production set SITE_DOMAIN=app.adaptivealgo.uk trong .env thật trên VPS
      # — xem docs/DEPLOY.md — Caddy tự xin Let's Encrypt cho domain đó.
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

# ═══════════════════════════════════════════════════════════════════════
# 🔴 `docker compose down -v` XOÁ SÁU KHO DƯỚI ĐÂY, KHÔNG PHẢI "vài thứ vặt".
#
# [ĐO 25/08] `docker compose config --volumes` liệt kê đủ sáu:
#   postgres_data  chroma_data  redis_data  logs_data  caddy_data  caddy_config
#
# ⚠️ ĐÍNH CHÍNH bản chú thích cũ ở chính chỗ này (Coder viết sáng 25/08, SAI
# vì NÓI NHẸ ĐI): nó ghi `down -v` "xoá bộ đếm chi tiêu LLM và phiên đăng
# nhập". Người viết đang thêm `redis_data` nên mô tả ĐÚNG THỨ MÌNH VỪA THÊM,
# và câu ấy bị đọc thành mô tả CẢ LỆNH. Sự thật: nó xoá TOÀN BỘ CSDL — mọi
# ticket, mọi khiếu nại, mọi resolution, mọi transcript chat — CỘNG chỉ mục RAG.
#
# 🔴 VÀ ĐÂY KHÔNG PHẢI RỦI RO GIẢ ĐỊNH. Hai dữ kiện, cùng ngày 25/08:
#   · [PO thật] production LÀ máy Windows cá nhân bật 24/7, chạy ngăn Docker
#     tên `fin05`, deploy THỦ CÔNG bằng `git pull` + `docker compose`.
#   · [sự cố] một phiên Coder lỡ để `docker compose down -v` chạy trên ngăn
#     `fin05` của máy dev — CÙNG TÊN NGĂN, CÙNG TÊN VOLUME, CÙNG LỆNH — và
#     xoá sạch CSDL demo + chỉ mục RAG trong một giây, không hỏi lại câu nào.
#   ⟹ Cùng một lệnh gõ trên máy production = mất dữ liệu KHÁCH HÀNG THẬT.
#     Chưa có bản sao lưu nào từng được diễn tập phục hồi.
#
# `docker compose` KHÔNG có hook, không hỏi xác nhận, không `--dry-run` mặc
# định ⟹ KHÔNG CÁCH NÀO cắm một cảnh báo vào lệnh. Chỉ BẢO VỆ là khả thi.
# ═══════════════════════════════════════════════════════════════════════
volumes:
  # 🔴 `external: true` CÓ CHỦ ĐÍCH — ĐỪNG GỠ ĐỂ "cho gọn".
  #
  # Volume external KHÔNG bị `docker compose down -v` xoá: compose in
  # "volume ... is external, skipping" rồi bỏ qua. Muốn xoá thật phải gõ
  # `docker volume rm fin05_postgres_data` — một câu không ai gõ nhầm.
  # Đây là kho DUY NHẤT mất đi thì KHÔNG dựng lại được: chroma_data dựng lại
  # bằng `scripts/kho_rag.py nap-lai`, logs/caddy tự sinh.
  #
  # 🔴 `name:` LÀ BẮT BUỘC, KHÔNG PHẢI TRANG TRÍ. [ĐO 25/08] `external: true`
  # mà KHÔNG có `name:` thì compose tìm volume tên trần `postgres_data`,
  # KHÔNG phải `fin05_postgres_data` — external KHÔNG được gắn tiền tố tên
  # ngăn. Thiếu dòng `name:` ⟹ `up` đi tìm một volume không tồn tại.
  #
  # An toàn để bật NGAY: [PO thật đọc `docker volume ls` trên máy production
  # 25/08] `fin05_postgres_data` ĐÃ TỒN TẠI ở đó ⟹ không cần tạo tay, `up`
  # dùng đúng volume đang chạy, dữ liệu không suy chuyển.
  #
  # 🔴 SỬA 25/08 SAU KHI DEVOPS SOÁT — ĐỌC TRƯỚC KHI ĐỔI THÀNH `external: true` TRẦN.
  # Bản đầu ghi `external: true` + `name: fin05_postgres_data` CỨNG. Nó chặn được
  # `down -v` thật, nhưng [ĐO] tên CỨNG VÔ HIỆU HOÁ tiền tố theo `-p`:
  #     docker compose -p fin05-sach up  ->  trỏ vào `fin05_postgres_data`
  # tức MỌI ngăn dựng từ tệp này, với BẤT KỲ `-p` nào, dùng CHUNG một volume vật
  # lý — đúng thứ cả đội dựa vào để cách ly ngăn (STATE.md: "bắt buộc `-p`").
  # Im lặng, không lỗi, không cảnh báo.
  #
  # Hai biến dưới đây trả lại cách ly VÀ giữ bảo vệ. [ĐO] `docker compose config`,
  # đủ ba ca — đây là câu trả lời cho "vì sao không để thẳng `true`":
  #   ① .env có `BAO_VE_CSDL=true`, KHÔNG cờ nào
  #        -> external: true · fin05_postgres_data      = đường PO gõ, bảo vệ BẬT
  #   ② cùng .env đó + `-p fin05-sach`
  #        -> external: true · fin05-sach_postgres_data = TIỀN TỐ TRỞ LẠI
  #   ③ KHÔNG có dòng ấy (CI, máy sạch, mọi clone)
  #        -> volume THƯỜNG, y như trước = CI và clone không vỡ gì
  #
  # 🔴 CHIỀU HỎNG LÀ CHIỀU ĐÚNG: quên dòng `.env` ⟹ hành vi Y HỆT trước bản vá
  # (không có bảo vệ), KHÔNG PHẢI một ngăn chết. Hỏng về phía CŨ, không về phía GÃY.
  #
  # Vế bất lợi, khai ra chứ không giấu: trên máy production, ai chạy `-p <tên khác>`
  # sẽ gặp `external volume not found` vì volume ngăn ấy chưa tồn tại. ỒN ÀO, không
  # im lặng — và "đừng dựng ngăn lạ trên máy production" vốn là hành vi đúng.
  #
  # Vì sao KHÔNG dùng override kèm `-f`: PO deploy bằng `docker compose up -d --build`
  # KHÔNG cờ nào. Bảo vệ nằm sau một cờ người ta phải nhớ = production mất bảo vệ.
  # `.env` thì compose đọc MẶC ĐỊNH, cùng thư mục, không cần nhớ gì.
  # Vì sao KHÔNG bind-mount thư mục máy chủ: còn TỆ HƠN — mọi ngăn dựng từ CÙNG thư
  # mục repo trỏ CÙNG một đường dẫn, và `-p` KHÔNG cứu nổi.
  postgres_data:
    external: ${BAO_VE_CSDL:-false}
    name: ${COMPOSE_PROJECT_NAME:-fin05}_postgres_data

  # 🔴 KHÔNG khai `external` cho redis_data. [PO thật đo 25/08] volume
  # `fin05_redis_data` CHƯA TỒN TẠI trên máy production (bản vá Redis 25/08
  # chưa được deploy lên đó) ⟹ khai external sẽ làm `up` CHẾT ngay lần deploy
  # kế tiếp. Bật được sau, khi máy ấy đã chạy qua một lần với volume này.
  # Mất nó = mất bộ đếm chi tiêu LLM + phiên đăng nhập (dựng lại được, đau
  # nhưng không mất dữ liệu khách).
  redis_data:
  chroma_data:
  logs_data:
  caddy_data:
  caddy_config:
