# contracts/authority-matrix.yaml
#
# SOURCE OF TRUTH for authority. Tester/Security/UX read this file, NOT src/.
#
# This file was REVERSE-generated from the running code (2026-08-13), not copied from the
# PRD — PRD §4 describes the initial design, and the code has gone further (adding the
# partner_admin role for the policy RAG, live chat, and a dedicated OTP step-up for resolution
# approval). The contract must match what IS RUNNING, otherwise every downstream artefact rests on
# dead information.
#
# ANTI-DRIFT MECHANISM (entirely different from "trust the instructions"):
#   tests/test_invariants.py::test_authority_matrix_khop_app_dang_chay
#   introspects `src.api.main.app` at runtime, extracts allowed_roles from the closure of
#   require_role(), and compares EVERY route with the table below. Add/remove/change one route's
#   guard and forget to update this file  →  test goes RED immediately, nobody has to remind anyone.
#
# Editing this file = requires an ADR + PO approval. See CLAUDE.md §3.
#
# KEY GLOSSARY (keys and free-text values are Vietnamese because tests read them verbatim;
# an English rendering of every contract lives in docs/en/contracts.md):
#   mo_ta = description · ghi_chu = note · ly_do = reason · ten = name · nguon = source
#   yeu_cau_otp = OTP requirement · bang = table · cot = columns · y_nghia = meaning
#   truy_vet = traceability · kieu = type · cham_tien = touches money · gia_tri_ma = code values
#   rang_buoc_db = DB constraint · bieu_thuc = expression · boi = enforced by · ranh_gioi = boundary

version: "2.4.0"
source: "Sinh ngược từ src/api/main.py @ 2026-08-13 · thay thế bản 1.0.0 viết từ PRD"
# v2.3.0 (04/09) — ADR-064, approved by the real PO. CSKH only see UNCLAIMED tickets + THEIR
# OWN (pool + own); supervisors are UNCHANGED (still see everything). The routes/roles of
# GET /tickets and GET /tickets/{ticket_id}/transcript are UNCHANGED (still
# [cskh, supervisor]) — the change is in ROW-LEVEL SCOPING (who sees which ROWS), described by the
# ghi_chu of each route. Adds a NEW route POST /tickets/{ticket_id}/claim
# [cskh] — an explicit, idempotent "Claim ticket" button.
# v2.2.0 (04/09) — ADR-063, the PO green-lit building the "new ticket notification bell".
# Adds 6 routes: GET /notifications · GET /notifications/unread-count ·
# POST /notifications/{notification_id}/read · POST /notifications/read-all ·
# POST /presence/heartbeat (cskh+supervisor) · GET /presence/staff (supervisor only). All 6
# declare extra: [require_token_chua_thu_hoi] (require an unrevoked token) FROM THE START
# — avoiding a repeat of the "forgot to add the new route to the allowlist" bug class (which had
# happened 3 times before, see the logout finding of 04/09).

# ---------------------------------------------------------------------------
# 4 REAL roles (the old contract was missing partner_admin — a real bug, fixed)
# ---------------------------------------------------------------------------
roles:
  customer:
    ten: "Khách hàng"
    mo_ta: "Người dùng cuối. Chat với AI, tra cứu giao dịch CỦA MÌNH, tạo ticket."
  cskh:
    ten: "Nhân viên CSKH"
    mo_ta: >
      Tiếp nhận, điều tra, đề xuất hướng xử lý. KHÔNG duyệt được bất cứ gì
      chạm tiền — kể cả scope nội bộ ví–ví (xem ADR-002).
  supervisor:
    ten: "Sếp / Người phê duyệt"
    mo_ta: >
      Người DUY NHẤT duyệt được resolution, cho MỌI phạm vi giao dịch.
      Kế thừa toàn bộ quyền của cskh (mọi route cskh đều mở cho supervisor).
  partner_admin:
    ten: "Quản trị đối tác ví"
    mo_ta: >
      CHỈ quản lý kho tài liệu chính sách (RAG). Không chạm ticket, không chạm
      tiền, không xem dữ liệu khách hàng. Vai này KHÔNG có trong PRD §4 gốc —
      phát sinh khi thêm tính năng RAG chính sách.

# ADR-029 item 4 (approved by the real PO 17/08). BEFORE this version the `scopes` section
# declared 3 values as bare description strings, WITHOUT `gia_tri_ma` (code values) — so no check
# could bridge the contract to the real CHECK constraint, and the fourth value `unknown`
# (added to the DB on 11/08) lived six days outside every document.
#
# Measured consequence: `flag_human_handoff` hard-coded `scope="internal_wallet"` for the whole
# customer-asks-for-a-human path — the system doing exactly what it FORBIDS the model to do — and
# no gate went red, because the contract didn't know `unknown` existed.
#
# `gia_tri_ma` is what lets `test_invariants` compare contract ↔ CHECK constraint.
# Add/remove a value on one side and forget the other ⟹ RED.
scopes:
  noi_bo_vi:
    mo_ta: "Giao dịch ví ↔ ví trong cùng hệ thống"
    gia_tri_ma: internal_wallet
  tu_ngan_hang:
    mo_ta: "Nạp tiền từ ngân hàng vào ví"
    gia_tri_ma: from_bank
  ra_ngan_hang:
    mo_ta: "Rút/chuyển tiền từ ví ra ngân hàng"
    gia_tri_ma: to_bank
  khong_ro:
    mo_ta: >
      KHÔNG tra ra được phạm vi, và khách cũng không xác định được. CSKH tự
      xác định thủ công sau. Song song với `other` của complaint_type.
      CHỈ hợp lệ trên `complaints` — `transactions` luôn biết phạm vi thật của
      nó, nên CHECK của bảng đó CỐ Ý chỉ có 3 giá trị.
    gia_tri_ma: unknown
    rang_buoc_db: ck_complaints_scope

# ---------------------------------------------------------------------------
# ROUTE TABLE — generated by machine, checked by machine.
#
# roles: []                   → public route, no login needed
# roles: [any_authenticated]  → only a valid JWT needed, no specific role enforced
# roles: [a, b]               → require_role("a","b")
# extra:                      → additional dependency (e.g. require_otp_verified)
# cham_tien: true             → route with financial consequences. INV-01 applies here.
# ---------------------------------------------------------------------------
routes:

  # --- Public ---
  - route: "GET /health"
    roles: []
    ghi_chu: "Liveness probe — KHÔNG được chạm DB/Redis."
  - route: "POST /auth/login"
    roles: []
  - route: "POST /auth/refresh"
    roles: []
    ghi_chu: "Refresh token tự mang danh tính, rotation + reuse detection ở src/auth.py."
  - route: "WS /ws/live-chat"
    roles: []
    ghi_chu: >
      Xác thực bằng ws-ticket dùng-một-lần TTL ngắn, KHÔNG bằng JWT —
      trình duyệt không gắn được header Authorization vào WebSocket handshake.
      Ticket lấy qua POST /live-chat/ws-ticket (customer) hoặc
      /live-chat/staff/ws-ticket (cskh, supervisor).

  # --- Logged in, no specific role ---
  - route: "POST /auth/logout"
    roles: [any_authenticated]
    extra: [get_current_user]
  - route: "POST /tools/lookup_transaction"
    roles: [any_authenticated]
    extra: [get_current_user]
    ghi_chu: >
      Không ép role vì cả customer lẫn cskh/supervisor đều tra cứu được.
      Quyền xem dữ liệu ai ĐƯỢC ép ở tầng dưới (_enforce_requester_is_party),
      không ở tầng role — xem INV-11.

  # --- customer ---
  - route: "POST /auth/otp/request"
    roles: [customer]
  - route: "POST /auth/otp/verify"
    roles: [customer]
  - route: "POST /agent/chat"
    roles: [customer]
  - route: "POST /tools/get_customer_history"
    roles: [customer]
  - route: "POST /tools/create_ticket"
    roles: [customer]
    extra: [require_otp_verified]
    ghi_chu: "OTP step-up bắt buộc (fresh ≤ 15 phút) — hành động có hậu quả."
  - route: "POST /live-chat/ws-ticket"
    roles: [customer]
  - route: "POST /live-chat/sessions/{chat_session_id}/csat"
    roles: [customer]

  # --- cskh + supervisor ---
  - route: "GET /tickets"
    roles: [cskh, supervisor]
    ghi_chu: >
      ADR-064(b) — ROW-LEVEL SCOPING (route/role không đổi): cskh chỉ thấy
      ticket CHƯA claim (`claimed_by IS NULL`, pool chung) HOẶC ticket
      `claimed_by = current_user`. supervisor KHÔNG lọc, thấy TẤT CẢ như
      trước — Sếp không claim, chỉ quản lý/duyệt.
  - route: "GET /tickets/{ticket_id}"
    roles: [cskh, supervisor]
    ghi_chu: >
      ADR-064(b) (04/09) — CÙNG LUẬT row-level scoping với GET /tickets và
      transcript (Review bắt lỗ thật lúc soát: route này ban đầu bị BỎ SÓT,
      trả nguyên description_raw/fraud_signals/resolutions/investigation_logs
      — nặng hơn transcript). cskh chỉ đọc được vé CHƯA claim (pool) HOẶC
      claimed_by CHÍNH MÌNH; 404 (không 403) cho vé người khác — cùng khuôn
      anti-enumeration với list/transcript. supervisor KHÔNG lọc.
  - route: "GET /tickets/{ticket_id}/transcript"
    roles: [cskh, supervisor]
    ghi_chu: >
      ADR-044 — CSKH đọc hội thoại bot↔khách của vé mình xử lý khi khách bàn
      giao gặp người thật. GUARD CHÍNH: route CHỈ nhận `ticket_id`, KHÔNG BAO
      GIỜ nhận `thread_id` làm tham số request (query/body/header) dưới bất
      kỳ hình thức nào — `thread_id` suy DUY NHẤT từ `ticket.complaint.
      thread_id` đọc từ DB.
      🔴 ADR-064(b) (04/09) — ĐỔI so với thiết kế gốc ADR-044: route này giờ
      áp CÙNG LUẬT row-level scoping với `GET /tickets` (KHÔNG còn "mọi
      cskh/supervisor đọc được mọi ticket"). cskh chỉ đọc được transcript
      của ticket `claimed_by IS NULL` (pool — mọi CSKH trực vẫn tiếp nhận
      được ca bàn giao) HOẶC `claimed_by = current_user` (đã claim). Ticket
      `claimed_by` thuộc CSKH KHÁC → 404 (cùng khuôn anti-enumeration với
      notifications — không lộ có tồn tại hay không). Lý do đổi: để mở sẽ
      mâu thuẫn trực tiếp mục tiêu "CSKH chỉ thấy vé của mình" VÀ hở BOLA
      trên dữ liệu PII hội thoại khách — nặng hơn hẳn route list thường.
      supervisor KHÔNG lọc, như trước. "user_id khớp" (ADR-044 cũ) vẫn chỉ
      là 404-handler phụ CHO PHẦN thread_id/transcript-null, KHÔNG thay thế
      luật claimed_by ở trên. Vé cũ (trước migration, thread_id null) trả
      transcript:null kèm lý do — không đoán theo mốc thời gian.
      `agent-tools.yaml` CỐ Ý KHÔNG đổi: cho AI tool đọc transcript bàn giao
      là để nó tự đọc hồ sơ "nó bị đá ra", cùng họ ràng buộc cứng số 2 (AI
      không vượt cấp) — AI gọi tool dưới danh nghĩa customer, không đi qua
      route này/không bị luật claimed_by trên chi phối.
  - route: "POST /tickets/{ticket_id}/claim"
    roles: [cskh]
    ghi_chu: >
      ADR-064(b) — nút "Nhận vé" chủ động (khớp mẫu "Mở & nhận" đã có ở
      dashboard live-chat). Set claimed_by=current_user + claimed_at=now.
      Idempotent: ticket đã claimed_by CHÍNH MÌNH → 200 không đổi gì (bấm
      lại không lỗi). Đã claimed_by NGƯỜI KHÁC → 409 (không cho cướp vé).
      supervisor KHÔNG có route này — Sếp không "nhận" vé, chỉ xem/duyệt.
  - route: "POST /tickets/{ticket_id}/request-more-info"
    roles: [cskh, supervisor]
    ghi_chu: >
      ADR-064(b) (04/09) — cskh không tác động được vé đã claim bởi CSKH
      khác: 404 (cùng khuôn anti-enumeration với list/detail/transcript).
      supervisor KHÔNG lọc.
  - route: "GET /resolutions"
    roles: [cskh, supervisor]
    ghi_chu: >
      ADR-064(b) (04/09, Review bắt — đường VÒNG rò cùng dữ liệu dù
      GET /tickets đã khoá) — cskh KHÔNG thấy resolution (amount/rationale/
      destination_ref) của ticket đã claim bởi CSKH khác, lọc theo
      Ticket.claimed_by qua join ticket_id. supervisor KHÔNG lọc.
  - route: "POST /tools/propose_resolution"
    roles: [cskh, supervisor]
    ghi_chu: >
      ĐỀ XUẤT, không phải duyệt. Resolution sinh ra luôn ở status='draft'
      hoặc 'pending_approval' — CHECK constraint ck_resolutions_status +
      ck_resolutions_approved_requires_approver_br10 chặn ghi thẳng 'approved'.
      ADR-064(b) (04/09) — ticket_id tới từ BODY, cùng luật row-level scoping:
      cskh không đề xuất được cho vé claimed_by CSKH khác (404).
  - route: "POST /tools/escalate_ticket"
    roles: [cskh, supervisor]
    ghi_chu: >
      ADR-064(b) (04/09) — cùng luật ở propose_resolution (ticket_id từ
      BODY, cskh bị chặn 404 nếu vé đã claim bởi người khác). KHÔNG chạm
      đường leo thang TỰ ĐỘNG của AI (fraud_policy/FS-06 trong create_ticket,
      code path khác hẳn) — route này CHỈ phục vụ leo thang TAY của nhân viên.
  - route: "GET /reports/summary"
    roles: [cskh, supervisor]
  - route: "POST /policy-search"
    roles: [cskh, supervisor]
  - route: "GET /policy-doc/{doc_id}"
    roles: [cskh, supervisor]
    ghi_chu: >
      ADR-065 (05/09) — deep-link đọc toàn văn cho kết quả /policy-search.
      CHỈ trả tài liệu status=indexed đã nạp qua /policy-docs (partner_admin);
      doc_id tra qua DB, không qua filesystem (chống path traversal). Query
      `chunk_id` optional để tính offset tô sáng — sai/không khớp thì bỏ qua
      tô sáng (không lỗi), không mở rộng phạm vi đọc ngoài tài liệu đã index.
  - route: "POST /live-chat/staff/ws-ticket"
    roles: [cskh, supervisor]
  - route: "GET /live-chat/sessions/by-ticket/{ticket_id}"
    roles: [cskh, supervisor]
    ghi_chu: >
      ADR-064(b) (04/09, Review bắt — rò SĐT khách thật qua `context`) —
      cùng luật row-level scoping. Ticket không tồn tại HOẶC claimed_by CSKH
      khác đều 404 giống nhau (không lộ khác biệt). supervisor KHÔNG lọc.
  - route: "GET /live-chat/sessions/waiting"
    roles: [cskh, supervisor]
  - route: "POST /live-chat/sessions/{chat_session_id}/claim"
    roles: [cskh, supervisor]
  - route: "POST /live-chat/sessions/{chat_session_id}/close"
    roles: [cskh, supervisor]

  # ADR-063 — new-ticket notification bell. Isolation by recipient
  # (recipient_user_id = the logged-in user, anti-BOLA) is enforced at the service layer, not in the
  # route — routes only enforce ROLE. Notification content is ONLY the ticket code + a type label,
  # no
  # amounts/PII/phone numbers (hard constraint #3 + PDPA).
  - route: "GET /notifications"
    roles: [cskh, supervisor]
    extra: [require_token_chua_thu_hoi]
  - route: "GET /notifications/unread-count"
    roles: [cskh, supervisor]
    extra: [require_token_chua_thu_hoi]
  - route: "POST /notifications/{notification_id}/read"
    roles: [cskh, supervisor]
    extra: [require_token_chua_thu_hoi]
  - route: "POST /notifications/read-all"
    roles: [cskh, supervisor]
    extra: [require_token_chua_thu_hoi]
  - route: "POST /presence/heartbeat"
    roles: [cskh, supervisor]
    extra: [require_token_chua_thu_hoi]
    ghi_chu: "Ghi khoá Redis presence:staff:<user_id> TTL 45s — không giữ state trong process."

  # --- 3 roles (customers re-reading their own conversation) ---
  - route: "GET /live-chat/sessions/{chat_session_id}/messages"
    roles: [cskh, customer, supervisor]
    ghi_chu: >
      customer: chỉ phiên CỦA CHÍNH MÌNH (403 nếu khác — check có SẴN trước
      ADR-064, không đổi). ADR-064(b) (04/09, Review độc lập soát toàn bộ 33
      route tìm ra — CÙNG mức nghiêm trọng transcript): cskh KHÔNG đọc được
      messages (đã che PII nhưng vẫn là transcript thật) của chat_session
      thuộc ticket đã claim bởi CSKH khác (404) — `chat_session_id` dễ lấy
      qua `by-ticket`/`sessions/waiting` TRƯỚC khi ai claim, đọc lại được
      VĨNH VIỄN sau đó nếu không chặn ở đây. supervisor KHÔNG lọc.

  # --- supervisor ONLY — the money-touching group ---
  - route: "POST /resolutions/{resolution_id}/request-approval-otp"
    roles: [supervisor]
    ghi_chu: "Xin OTP step-up RIÊNG cho đúng 1 resolution (PSD2 dynamic linking)."
  - route: "POST /resolutions/{resolution_id}/approve"
    roles: [supervisor]
    cham_tien: true
    ghi_chu: >
      CỬA DUY NHẤT đưa resolution sang 'approved'. Yêu cầu OTP khớp
      resolution_id + amount_snapshot khớp amount hiện tại (đổi số tiền sau khi
      xin OTP ⟹ phải xin lại). Xem AUTH5-04/05/05B.
  - route: "POST /resolutions/{resolution_id}/reject"
    roles: [supervisor]
    ghi_chu: "Từ chối KHÔNG cần OTP — không phải hành động tài chính."
  - route: "GET /presence/staff"
    roles: [supervisor]
    extra: [require_token_chua_thu_hoi]
    ghi_chu: "ADR-063 — bảng 'CSKH nào đang online' + số vé đang xử lý, chỉ Sếp xem."

  # --- partner_admin ONLY — the policy RAG store ---
  - route: "POST /policy-docs"
    roles: [partner_admin]
  - route: "GET /policy-docs"
    roles: [partner_admin]
  - route: "DELETE /policy-docs/{doc_id}"
    roles: [partner_admin]

# ---------------------------------------------------------------------------
# INVARIANTS — tests/test_invariants.py reads this section
# ---------------------------------------------------------------------------
invariants:
  - id: INV-01
    mo_ta: "Mọi route cham_tien=true chỉ cho phép đúng role supervisor"
    nguon: "CLAUDE.md §2.1 — HITL tuyệt đối"
  - id: INV-02
    mo_ta: >
      Không route nào mở cho customer/cskh mà có cham_tien=true.
      AI agent không có role riêng — nó gọi tool DƯỚI DANH NGHĨA customer,
      nên chặn được customer là chặn được AI.
    nguon: "CLAUDE.md §2.1"
  - id: INV-03
    mo_ta: "Route duyệt/từ chối resolution không bao giờ mở cho cskh"
    nguon: "CLAUDE.md §2.2 — CSKH điều tra, không quyết"
  - id: INV-04
    mo_ta: >
      Thẩm quyền định nghĩa theo ROLE, không theo hạn mức tiền.
      Không route nào được có điều kiện dạng max_amount/limit/threshold.
    nguon: "PRD §4.6"
  - id: INV-11
    mo_ta: >
      partner_admin không chạm được bất kỳ route nào liên quan ticket/
      resolution/khách hàng — chỉ /policy-docs*.
    nguon: "Nguyên tắc least-privilege, phát sinh cùng tính năng RAG"

# ---------------------------------------------------------------------------
# OPEN QUESTIONS — awaiting an e-wallet domain expert
# ---------------------------------------------------------------------------
open_questions:
  - "Có tồn tại vai 'CSKH cấp 2' được duyệt case nội bộ nhỏ trong thực tế không?
     Dự án CỐ Ý không mô hình hoá vai này — cần xác nhận đây là lựa chọn thiết kế
     hợp lý, không phải thiếu sót."
  - "supervisor hiện kế thừa toàn bộ quyền cskh. Ví thật có tách bạch tuyệt đối
     (sếp KHÔNG được tự điều tra) để chống xung đột lợi ích không?"
